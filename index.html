"SUE-01":{who:"Leo, 16 años",ch:[
["Leo llega a clase con los ojos rojos otra vez. Su profe de mates le pregunta si está bien. «Duermo bien», responde. Pero ¿de verdad?","¿Qué hace Leo esa noche?",["Apunta a qué hora se acuesta","Pasa: total, duerme «bien»"],["Apunta 00:47. Se sorprende: creía que se acostaba a las 23.","Se duerme sin saber cuándo. Mañana seguirá sin datos."]],
["Al día siguiente, a las 23:30, Leo está viendo vídeos. «Solo uno más», piensa.","¿Qué hace?",["Deja el móvil y apunta la hora","Sigue con «uno más»"],["Apunta 23:40. Hoy ha ganado una hora.","Es la 1:15 cuando se da cuenta. Mañana va a costar."]],
["En el recreo, su amiga Ona le dice que duerme 9 horas y está fresca. Leo se ríe: «Eso es imposible».","¿Qué piensa Leo?",["«A lo mejor yo también podría»","«Ella es rara»"],["Se queda pensando: ¿y si su cansancio no es normal?","Se queda igual. Y el cansancio, también."]],
["El viernes por la noche sus amigos juegan online hasta las 3. Leo quiere ir con ellos.","¿Qué decide?",["Juega hasta la 1 y se despide","Se queda hasta las 3"],["Se acuesta a la 1:10. Lo apunta. No es perfecto, pero es mejor.","Se acuesta a las 3:20. El sábado se despierta a las 13:00, de mal humor."]],
["Es domingo. Leo suma sus horas: la media de la semana es de 6 horas y 20 minutos. Necesita unas 9.","¿Cómo reacciona?",["Lo ve como información: ya sabe qué pasa","Se agobia: «soy un desastre»"],["Por fin entiende por qué está tan irritable. Ahora puede cambiarlo.","Se machaca, pero no cambia nada. Saberlo debería ayudarle, no hundirle."]],
["Lunes. Leo se plantea qué hacer con lo que ha descubierto.","¿Qué decide?",["Intentar acostarse 30 minutos antes","Dejarlo para cuando acaben los exámenes"],["Pequeño cambio, gran diferencia. El martes ya nota la cabeza más clara.","Los exámenes llegan con él agotado. Lo que más le habría ayudado era dormir."]]],
end:{ok:"Leo terminó la semana sabiendo exactamente cuánto dormía. No cambió todo de golpe: primero midió, luego ajustó 30 minutos. Eso es lo que funciona.",ko:"Leo se quedó sin datos o los ignoró. No pasa nada: medir cuesta los primeros días. La próxima semana, apuntar solo la hora de levantarse ya sería un gran paso."}},
"MOV-01":{who:"Aina, 17 años",ch:[
["Aina lleva semanas de bajón. Entre exámenes y discusiones en casa, no tiene ganas de nada. Su prima le dice que salga a caminar.","¿Qué piensa Aina?",["«Por probar, 30 minutos no me matan»","«Caminar no arregla nada»"],["Al menos lo va a intentar. Eso ya es mucho.","Quizá tenga razón en que no lo arregla todo. Pero ¿y si ayuda un poco?"]],
["Martes. Al salir de clase, sus amigas van en bus. Aina podría volver andando: 30 minutos.","¿Qué hace?",["Vuelve andando con música","Coge el bus, como siempre"],["Antes de salir se puntuó un 4. Al llegar, un 6. Interesante.","Llega a casa igual que salió."]],
["Miércoles llueve un poco. Aina mira por la ventana.","¿Qué decide?",["Sale con capucha, 20 minutos","Hoy no, que llueve"],["Vuelve empapada y riéndose. Ánimo: de 5 a 7.","Se queda en el sofá. No pasa nada: un día no rompe nada si mañana vuelve."]],
["Jueves tiene examen y está nerviosa. «No tengo tiempo para caminar», piensa.","¿Qué hace?",["Camina 15 minutos antes de estudiar","Se pone a estudiar directamente"],["Estudia más concentrada. El movimiento le ha despejado la cabeza.","Estudia nerviosa y se distrae mucho."]],
["Viernes. Aina se da cuenta de que caminar le sienta bien. Su amiga Laia le pregunta qué hace.","¿Qué hace Aina?",["Le propone caminar juntas el sábado","No dice nada, le da vergüenza"],["Caminan y hablan durante una hora. El mejor rato de la semana.","Camina sola. También está bien, pero acompañada habría sido más fácil."]],
["Domingo. Aina mira sus puntuaciones: casi siempre sube 2 puntos después de caminar.","¿Qué decide?",["Lo convierte en costumbre 3 días a la semana","Lo deja ahora que está mejor"],["Lo apunta en el calendario: lunes, miércoles y viernes. Ya no lo deja al azar.","Al dejarlo, el bajón vuelve a la semana siguiente. Moverse funciona mientras lo haces."]]],
end:{ok:"Aina descubrió que moverse le subía el ánimo de verdad: lo midió, no se lo contaron. Y lo convirtió en costumbre con días fijos.",ko:"Aina no llegó a probarlo lo suficiente para notar el efecto. La próxima vez, con 15 minutos ya basta: lo importante es empezar y medir cómo te sientes antes y después."}},
"ALI-01":{who:"Joel, 16 años",ch:[
["Joel desayuna un bollo envasado cada mañana y a media mañana compra patatas en la máquina. A las 12 está agotado.","¿Qué hace el lunes?",["Lleva una pieza de fruta en la mochila","Sigue igual, que le gusta"],["La fruta no es un bollo, pero a las 12 está más despierto.","El bajón de las 12 llega puntual."]],
["Martes. Pasa por delante de la máquina y le llaman las patatas.","¿Qué hace?",["Se come la fruta que lleva","Compra las patatas"],["Ahorra 1,50 euros y no tiene bajón.","Las patatas duran 2 minutos. El hambre vuelve a la media hora."]],
["Miércoles, en casa, quiere picar algo mientras estudia.","¿Qué coge?",["Un puñado de frutos secos","Galletas de chocolate"],["Le sacian más y no tiene el subidón y bajón del azúcar.","Se acaba el paquete sin darse cuenta."]],
["Jueves sus amigos van a por comida rápida.","¿Qué hace Joel?",["Va y la disfruta sin culpa","Va y luego se siente fatal"],["Un capricho con amigos está bien: el cambio es en el día a día, no en prohibirlo todo.","La culpa no ayuda. Disfrutar a veces es parte de comer bien."]],
["Viernes. Joel nota que tiene más energía por las mañanas.","¿Qué hace?",["Cambia el bollo del desayuno por tostada","Piensa que ya ha hecho suficiente"],["Tostada con aceite y tomate: le dura hasta el recreo sin bajón.","Mantiene lo conseguido, pero el bollo sigue mandando por las mañanas."]],
["Domingo. Repasa la semana: ha cambiado 4 ultraprocesados por comida real.","¿Qué decide?",["Seguir con un cambio al día","Volver a lo de antes"],["Lo pequeño, repetido, cambia cómo se siente.","Vuelve el bajón de las 12. Ahora al menos sabe de dónde viene."]]],
end:{ok:"Joel no hizo una dieta: cambió una cosa al día y se permitió caprichos sin culpa. Por eso le funcionó.",ko:"Joel lo intentó, pero le costó mantenerlo. La próxima vez: llevar la fruta en la mochila la noche antes hace que la decisión ya esté tomada."}},
"EMO-01":{who:"Sara, 17 años",ch:[
["Sara está «rayada» todo el día. Cuando su madre le pregunta qué le pasa, solo sabe decir «nada, estoy mal».","Su orientadora le propone ponerle un nombre más exacto. ¿Qué hace Sara?",["Lo intenta: busca una palabra más exacta","Le parece una tontería"],["Escribe: «frustrada». Ya es más que «mal».","Sigue «rayada», sin saber por qué."]],
["En clase, una amiga hace planes sin contar con ella. Sara siente algo fuerte.","¿Qué palabra elige?",["«Excluida» y «dolida»","«Estoy mal», otra vez"],["Al nombrarlo, entiende que lo que le duele es sentirse fuera.","Sin nombre, el malestar se queda flotando."]],
["Por la tarde, tiene un examen mañana y se nota inquieta.","¿Qué escribe?",["«Nerviosa, pero preparada»","No escribe nada"],["Separar nervios de miedo le ayuda a ver que sí lo ha estudiado.","Los nervios se convierten en una nube gris sin forma."]],
["Jueves. Sara se da cuenta de que lo de su amiga le sigue doliendo.","¿Qué hace?",["Le dice: «me sentí excluida el lunes»","Se lo calla y se enfada"],["Su amiga le pide perdón: no se había dado cuenta.","El enfado crece y se aleja de su amiga sin que ella sepa por qué."]],
["Viernes. Sara repasa sus palabras de la semana: frustrada, excluida, nerviosa, aliviada.","¿Qué piensa?",["«No estaba mal: eran cosas distintas»","«Esto no sirve para nada»"],["Cada emoción pedía algo distinto. Ahora sabe qué hacer con cada una.","Quizá aún no lo ve. Nombrar emociones es como un músculo: cuesta al principio."]],
["Domingo. Su madre le pregunta qué tal la semana.","¿Qué responde?",["«Bien, aunque el lunes me sentí excluida»","«Bien», y ya"],["Hablan 20 minutos. Hacía meses que no hablaban así.","La conversación se queda en la superficie."]]],
end:{ok:"Sara pasó de «estoy mal» a saber exactamente qué sentía. Y al saberlo, pudo hablarlo y resolverlo.",ko:"A Sara le costó encontrar palabras. Es normal: muchos adultos tampoco saben. La próxima vez, una sola palabra al día ya es un buen comienzo."}},
"PEN-01":{who:"Marc, 16 años",ch:[
["Marc tiene que exponer un trabajo el viernes. Solo de pensarlo se le encoge el estómago: «Voy a hacer el ridículo».","¿Qué hace con ese pensamiento?",["Lo escribe para mirarlo de cerca","Intenta no pensar en ello"],["Escrito en un papel parece menos enorme.","Cuanto más intenta no pensarlo, más aparece."]],
["Busca pruebas. ¿Alguien se rió de los que expusieron la semana pasada?","¿Qué responde Marc con sinceridad?",["«No, nadie se rió»","«Seguro que por dentro sí»"],["La prueba dice que su miedo exagera.","Está leyendo la mente: no puede saber qué piensan los demás."]],
["Miércoles, ensaya y se equivoca en una diapositiva. «Siempre lo hago todo mal».","¿Cómo lo ve?",["«Me he equivocado en una, no en todo»","«Lo ves, soy un desastre»"],["«Siempre» y «todo» eran exagerados. Corrige la diapositiva y sigue.","Generalizar convierte un error pequeño en una sentencia."]],
["Jueves por la noche. «Si sale mal, suspenderé y será horrible».","¿Qué hace?",["Se pregunta qué es lo peor que puede pasar de verdad","Se pasa la noche dándole vueltas"],["Lo peor real: un rato incómodo y quizás un 6. No es el fin del mundo.","Duerme poco y llega más nervioso."]],
["Viernes. Marc expone. Se traba una vez y sigue.","Al terminar, ¿qué piensa?",["«Me he trabado una vez y ha salido bien»","«Me he trabado: ha sido un desastre»"],["Saca un 7,5. Su profe destaca lo claro que ha sido.","Saca un 7,5, pero él solo recuerda el tropiezo."]],
["Domingo. Marc repasa sus pensamientos de la semana.","¿Qué aprende?",["Que su cabeza exagera y puede revisarla","Que ha tenido suerte"],["Ya tiene una herramienta para la próxima vez: escribir, buscar pruebas, revisar.","No era suerte: era su miedo exagerando. La próxima vez, búscale pruebas."]]],
end:{ok:"Marc aprendió que sus pensamientos no son hechos. Escribirlos y buscarles pruebas le quitó gran parte del miedo.",ko:"A Marc le costó revisar sus pensamientos. Es lo normal al principio. La próxima vez, prueba solo a escribir el pensamiento: verlo en papel ya ayuda."}},
"HAB-01":{who:"Nora, 16 años",ch:[
["Nora se sienta a estudiar con el móvil al lado. A los 5 minutos ya está en Instagram. «No tengo fuerza de voluntad», piensa.","¿Qué prueba hoy?",["Dejar el móvil en otra habitación","Prometerse que esta vez no lo mirará"],["Sin el móvil a la vista, estudia 40 minutos seguidos.","A los 7 minutos, ya lo ha mirado. Las promesas no bastan."]],
["Martes. El móvil vibra en la cocina.","¿Qué hace?",["Sigue estudiando: lo mirará en el descanso","Va corriendo a mirarlo"],["Era un grupo de clase. Podía esperar.","Pierde 20 minutos contestando cosas que no eran urgentes."]],
["Miércoles quiere hacer ejercicio por la tarde, pero siempre se le olvida.","¿Qué hace?",["Deja las zapatillas junto a la puerta","Se pone una nota mental"],["Al verlas al llegar, sale a correr sin pensarlo.","La nota mental se pierde entre los deberes."]],
["Jueves su hermano pone la tele mientras ella estudia.","¿Qué hace?",["Se cambia a la biblioteca","Se queda y se distrae"],["En la biblioteca no hay tentaciones. Avanza el doble.","Ve medio capítulo de la serie sin querer."]],
["Viernes. Nora se da cuenta de algo.","¿Qué piensa?",["«No me faltaba voluntad: me sobraban tentaciones»","«Esta semana he tenido suerte»"],["Cambiar el entorno es más fácil que pelear contra uno mismo.","No era suerte: era el entorno trabajando a su favor."]],
["Domingo. Nora prepara la semana siguiente.","¿Qué hace?",["Deja el escritorio limpio y el móvil cargando fuera","No prepara nada"],["El lunes empieza con todo a favor.","El lunes el móvil vuelve a estar en la mesa."]]],
end:{ok:"Nora dejó de culparse por falta de voluntad y empezó a diseñar su entorno. Las personas que parecen muy disciplinadas hacen exactamente eso.",ko:"Nora siguió peleando contra las tentaciones en lugar de apartarlas. La próxima vez: el móvil fuera antes de empezar, sin negociar."}},
"REL-01":{who:"Iker, 17 años",ch:[
["Iker tiene 600 seguidores, pero los fines de semana se aburre solo. Hace meses que no queda con Dani, su mejor amigo de primaria.","¿Qué hace hoy?",["Le escribe a Dani","Piensa que Dani ya tendrá otros amigos"],["Dani contesta en 5 minutos: «¡Tío! ¿Qué es de tu vida?».","Se queda con la duda. Quizá Dani piense lo mismo de él."]],
["Martes. Dani propone quedar el sábado.","¿Qué responde Iker?",["«Hecho, el sábado»","«Ya veremos», por si acaso"],["Ya hay plan. La semana tiene algo bonito que esperar.","El plan queda en el aire y probablemente no pase."]],
["Miércoles. Iker se da cuenta de que hace tiempo que no habla con su abuela.","¿Qué hace?",["La llama 10 minutos","Lo deja para otro día"],["Su abuela le cuenta una historia de cuando tenía su edad. Se ríen mucho.","Otro día que no llega."]],
["Jueves en clase, un compañero nuevo come solo.","¿Qué hace Iker?",["Se sienta con él","Sigue con su grupo"],["Se llama Ahmed y le gusta el mismo videojuego. Ya tienen tema.","Ahmed sigue solo. Iker sabe lo que es sentirse así."]],
["Sábado. Iker y Dani quedan. Hablan tres horas seguidas.","De vuelta a casa, ¿qué piensa?",["«Esto lo necesitaba más de lo que creía»","«Ha estado bien, pero no hace falta repetir»"],["Se da cuenta de que se sentía solo aunque tuviera muchos seguidores.","Las amistades se cuidan como las plantas: si no se riegan, se secan."]],
["Domingo. Iker repasa su semana.","¿Qué decide?",["Quedar con alguien cada semana","Volver a la rutina de siempre"],["Una persona por semana. Pequeño, pero cambia cómo se siente.","La soledad vuelve sin hacer ruido."]]],
end:{ok:"Iker descubrió que lo que le faltaba no eran seguidores, sino relaciones de verdad. Y que cuidarlas cuesta un mensaje.",ko:"A Iker le costó dar el primer paso. Es lo más difícil. La próxima vez, un solo mensaje («me he acordado de ti») es suficiente para empezar."}},
"ATE-01":{who:"Lucía, 16 años",ch:[
["Lucía mira su tiempo de pantalla: 6 horas al día. «Imposible», piensa. Recibe más de 100 notificaciones diarias.","¿Qué hace?",["Revisa qué apps le mandan notificaciones","Cierra la pantalla y lo olvida"],["Descubre que 8 apps le avisan de cosas que no son de personas.","Las notificaciones siguen decidiendo por ella."]],
["Martes. Decide qué notificaciones dejar.","¿Qué desactiva?",["Todas las que no son de personas","Solo una o dos"],["Su móvil se queda en silencio. Al principio es raro; luego, un alivio.","Mejora algo, pero el móvil sigue llamándola cada pocos minutos."]],
["Miércoles. Abre TikTok «un momento» antes de estudiar.","¿Qué hace?",["Se pone un temporizador de 10 minutos","Deja que el scroll decida"],["Al sonar, cierra. Ha controlado ella el tiempo.","Una hora después, sigue ahí. El scroll infinito está diseñado para eso."]],
["Jueves. Una app le dice que va a perder su racha si no entra.","¿Qué piensa?",["«Las rachas son para engancharme»","«No puedo perderla»"],["Entiende el truco y decide ella. Hoy no entra.","Entra por obligación. La app ha ganado."]],
["Viernes. Lucía tiene una tarde libre.","¿Qué hace?",["Queda con amigas y deja el móvil en la mochila","Se pasa la tarde con el móvil"],["Hacía tiempo que no se reía tanto.","Al final del día no recuerda nada de lo que ha visto."]],
["Domingo. Mira su tiempo de pantalla de la semana: 4 horas al día.","¿Qué piensa?",["«He recuperado 2 horas al día»","«Sigue siendo mucho, no sirve»"],["14 horas a la semana para lo que de verdad le importa.","Dos horas menos al día es muchísimo. Cada paso cuenta."]]],
end:{ok:"Lucía entendió que las apps están diseñadas para quedarse con su tiempo, y recuperó el control con cambios sencillos.",ko:"A Lucía le costó, porque las apps están hechas para eso: no es falta de voluntad. La próxima vez, empieza desactivando las notificaciones de una sola app."}},
"EST-01":{who:"Pau, 17 años",ch:[
["Pau está siempre tenso. Exámenes, el equipo de baloncesto, discusiones en casa… «Estoy estresado», dice a todo.","¿Qué hace hoy?",["Apunta de dónde viene su estrés","Sigue aguantando"],["En el papel salen tres cosas distintas. Ya no es una nube.","El estrés sigue siendo una masa gris sin forma."]],
["Martes. Mira su lista: exámenes, partidos y la tensión en casa.","¿Qué descubre?",["Que dos son puntuales y una es permanente","Que todo es igual de grave"],["Los exámenes y los partidos pasan. Lo de casa no se va solo.","Si todo parece igual de grave, no sabes por dónde empezar."]],
["Miércoles tiene partido y está nervioso.","¿Cómo lo ve?",["«Mi cuerpo se está preparando»","«No puedo con esto»"],["Juega con energía. Los nervios le ayudan.","Los nervios le bloquean y juega peor."]],
["Jueves, en casa hay otra discusión. Pau se encierra en su cuarto.","¿Qué hace después?",["Se lo cuenta a su tutor","Se lo guarda, como siempre"],["Su tutor le escucha y le ayuda a pensar qué puede hacer. Se siente menos solo.","El peso sigue ahí, solo con él."]],
["Viernes. Pau se da cuenta de que no descansa nunca: hasta el ocio es móvil.","¿Qué hace?",["Sale a dar una vuelta en bici","Más scroll en la cama"],["Vuelve cansado de cuerpo pero con la cabeza ligera.","Se duerme tarde y igual de tenso."]],
["Domingo. Pau mira su semana.","¿Qué decide?",["Pedir ayuda para lo permanente y descansar de verdad","Seguir aguantando"],["Lo puntual se gestiona; lo permanente se habla. Ya sabe la diferencia.","Aguantar el estrés permanente sin ayuda no es fortaleza: es desgaste."]]],
end:{ok:"Pau separó el estrés que pasa del que se queda, y para el que se queda buscó ayuda. Eso es ser fuerte de verdad.",ko:"A Pau le costó pararse a mirar su estrés. La próxima vez: solo apuntar una fuente al día ya ayuda a ordenarlo. Y si algo pesa mucho, habla con alguien."}},
"VAL-01":{who:"Emma, 16 años",ch:[
["Emma tiene que elegir optativas y no sabe qué quiere. Todo el mundo le dice qué hacer.","Su tutora le propone empezar por sus valores. ¿Qué hace Emma?",["Mira la lista y elige 5","Elige lo que eligen sus amigas"],["Elige: familia, aprender, ayudar, libertad y amistad.","Elige por otros. Así es difícil saber qué quiere ella."]],
["Martes. Mira sus valores: ¿qué hace esta semana por «aprender»?","¿Qué decide?",["Ver un documental de algo que le interesa","Nada, ya aprende en clase"],["Ve uno sobre biología marina. No puede parar.","Aprender en clase cuenta, pero lo que eliges tú dice más de ti."]],
["Miércoles. Su valor «ayudar».","¿Qué hace?",["Ayuda a su hermano pequeño con los deberes","Lo deja para otro día"],["Su hermano entiende las fracciones. Emma se siente útil.","El día pasa sin que el valor se note."]],
["Jueves. Una amiga quiere que copie un examen.","¿Qué hace, pensando en sus valores?",["Dice que no, aunque le cueste","Le pasa el examen para no quedar mal"],["Mantiene su honestidad. Su amiga se enfada un rato, pero lo entiende.","Se siente incómoda todo el día. Algo no encaja con quien quiere ser."]],
["Viernes. Emma vuelve a mirar las optativas con sus valores al lado.","¿Qué pasa?",["Biología le encaja con «aprender» y «ayudar»","Sigue sin saber"],["Por primera vez la decisión tiene sentido para ella.","No pasa nada: los valores no dan respuestas mágicas, pero orientan."]],
["Domingo. Emma piensa en la semana.","¿Qué decide?",["Usar sus valores para decidir","Volver a decidir por lo que digan los demás"],["Tiene una brújula propia.","Decidir por otros es más fácil hoy, pero más difícil después."]]],
end:{ok:"Emma no tenía todas las respuestas, pero tenía una brújula: sus valores. Con ellos, las decisiones empezaron a tener sentido.",ko:"A Emma le costó guiarse por lo que ella valora. Es normal a los 16. La próxima vez, elige un solo valor y una acción pequeña."}},
"DIN-19":{who:"Álex, 16 años",ch:[
["Álex recibe 25 euros de paga a la semana y nunca le queda nada. «El dinero es para gastarlo», dice.","Su tía le pregunta qué le gustaría poder hacer dentro de unos años. ¿Qué responde?",["«Irme de viaje con mis amigos al acabar el curso»","«No lo sé, ya veré»"],["Ese viaje cuesta unos 400 euros. Ya tiene un objetivo.","Sin objetivo, el dinero se va solo."]],
["Martes. Ve unas zapatillas de 90 euros en un anuncio.","¿Qué hace?",["Piensa en su viaje antes de comprar","Las compra al momento"],["Decide esperar. Sus zapatillas actuales están bien.","Las compra. El viaje se aleja tres semanas de paga."]],
["Miércoles. Su amigo le dice que con dinero se puede presumir.","¿Qué piensa Álex?",["«Prefiero tener opciones que aparentar»","«Tiene razón»"],["Entiende que el dinero le puede dar libertad, no solo cosas.","Aparentar se acaba rápido. Las opciones duran."]],
["Jueves. Recibe 20 euros por ayudar a un vecino.","¿Qué hace?",["Guarda la mitad para el viaje","Se lo gasta en el día"],["Ya lleva 10 euros ahorrados. Se ríe: es la primera vez.","El dinero desaparece y no recuerda en qué."]],
["Viernes. Álex hace cuentas: si guarda 10 euros a la semana, en 40 semanas tendrá el viaje.","¿Qué decide?",["Apartar 10 euros cada vez que cobre","Ahorrar «lo que sobre»"],["Primero aparta, después gasta. Así sí llega.","Lo que sobra casi nunca sobra."]],
["Domingo. Álex mira su hucha: 25 euros.","¿Qué siente?",["Que es libre de elegir su viaje","Que es poco"],["Es poco, pero es suyo y va en camino. Eso es libertad.","Es poco, pero es más que nunca. Y crece cada semana."]]],
end:{ok:"Álex entendió que el dinero no es para presumir sino para poder elegir. Y empezó a construir su libertad con 10 euros a la semana.",ko:"A Álex le costó resistirse a gastar. Es lo normal: todo está pensado para que compres. La próxima vez, apartar 1 euro al cobrar ya es empezar."}},
"EDU-01":{who:"Irene, 17 años",ch:[
["Irene estudia historia releyendo los apuntes tres veces. En el examen, se queda en blanco.","Su profe le habla de practicar recordando. ¿Qué hace?",["Lo prueba con el siguiente tema","Sigue releyendo, que es lo que sabe hacer"],["Cierra el libro y escribe lo que recuerda: solo la mitad. Le sorprende.","Releer da sensación de saber, pero engaña."]],
["Martes. Irene repasa justo la mitad que no recordaba.","¿Cómo lo hace?",["Se hace preguntas y las responde sin mirar","Lo vuelve a leer"],["Le cuesta más, pero se le queda.","Le suena, pero no lo sabe explicar."]],
["Miércoles. Tiene poco tiempo para estudiar.","¿Qué hace?",["10 minutos de recordar sin mirar","Lo deja para el fin de semana"],["Diez minutos activos valen más que una hora leyendo.","El fin de semana se acumulan tres temas."]],
["Jueves. Una amiga le pide ayuda con historia.","¿Qué hace Irene?",["Le explica el tema sin mirar los apuntes","Le pasa los apuntes"],["Al explicarlo, descubre lo que sabe y lo que no. Las dos aprenden.","Ayuda, pero ella pierde una ocasión de repasar."]],
["Viernes. El día antes del examen.","¿Qué hace?",["Repasa haciéndose preguntas y duerme 8 horas","Estudia hasta las 2 releyendo"],["Llega descansada y con lo importante fijado.","Llega cansada y con todo «sonándole»."]],
["Sábado. Le dan la nota: un 7,5, su mejor nota en historia.","¿Qué piensa?",["«Estudié menos horas, pero mejor»","«He tenido suerte con las preguntas»"],["No fue suerte: fue la técnica.","No era suerte: recordar activamente funciona. La próxima vez lo verá."]]],
end:{ok:"Irene descubrió que estudiar bien no es estudiar más horas: es obligar al cerebro a recordar. Su nota lo demostró.",ko:"A Irene le costó dejar de releer, porque releer parece más fácil. La próxima vez, prueba solo a decir en voz alta tres cosas del tema sin mirar."}},
"CRI-01":{who:"Dani, 16 años",ch:[
["A Dani le llega un vídeo: «Van a prohibir los móviles a menores en toda España». Se indigna.","¿Qué hace?",["Lo busca en otro medio antes de compartirlo","Lo comparte en tres grupos"],["En ningún medio serio aparece. Es un bulo.","Ya lo han visto 50 personas. Y era falso."]],
["Martes. Ve un titular que le da la razón en algo que piensa.","¿Qué hace?",["Lo comprueba igual","Lo cree porque le gusta"],["Era verdad, pero exagerado. Ahora lo sabe.","Los bulos que nos dan la razón son los más fáciles de creer."]],
["Miércoles. Un influencer dice que un producto «cura la ansiedad».","¿Qué piensa Dani?",["«¿Qué pruebas tiene? ¿Gana dinero vendiéndolo?»","«Si lo dice él, será verdad»"],["El influencer cobra por promocionarlo. Ninguna prueba.","Un producto milagro casi nunca es lo que promete."]],
["Jueves. Su grupo comparte una captura de una conversación que deja mal a alguien.","¿Qué hace?",["Pregunta de dónde sale antes de creerla","Se ríe y la reenvía"],["Era un montaje. Dani evita hacer daño a alguien.","Una captura falsa puede destrozar a una persona."]],
["Viernes. Dani se da cuenta de que su abuelo comparte muchos bulos.","¿Qué hace?",["Le enseña Maldita.es con paciencia","Se burla de él"],["Su abuelo empieza a preguntarle antes de compartir.","Burlarse no ayuda: enseñar sí."]],
["Domingo. Dani repasa su semana: ha frenado 4 bulos.","¿Qué piensa?",["«Antes me creía casi todo»","«Tampoco era para tanto»"],["Tener criterio propio le hace más difícil de manipular.","Cada bulo frenado es una mentira que no llega a más gente."]]],
end:{ok:"Dani se convirtió en alguien que comprueba antes de creer. En un mundo lleno de bulos, eso es un superpoder.",ko:"A Dani le costó frenar antes de compartir: los bulos están hechos para que reacciones rápido. La próxima vez, espera solo un minuto y pregúntate quién lo dice."}},
"AUT-01":{who:"Marina, 17 años",ch:[
["Marina siempre ha pensado que es «rara» porque no le gustan las fiestas grandes.","Su orientadora le propone hacer un test de personalidad serio. ¿Qué hace?",["Hace el test Big Five","Prefiere uno de Instagram"],["Sale baja en extraversión y alta en apertura. Interesante.","Los test de redes son divertidos, pero poco fiables."]],
["Martes. Lee qué significa ser poco extravertida.","¿Qué entiende?",["Que recarga energía sola, no que sea rara","Que tiene un problema"],["Por fin tiene una explicación que no la juzga.","No es un problema: es una forma de ser, como cualquier otra."]],
["Miércoles. Sus amigas organizan una fiesta enorme.","¿Qué hace Marina?",["Va un rato y se va cuando se cansa","Va toda la noche aunque lo pase mal"],["Lo disfruta porque respeta su energía.","Acaba agotada. Conocerse sirve para cuidarse."]],
["Jueves. Lee qué significa ser alta en apertura: curiosa, creativa.","¿Qué hace?",["Se apunta a un taller de fotografía","No hace nada con eso"],["Le encanta. Por fin algo que es muy suyo.","Saber cómo eres sirve más si lo usas."]],
["Viernes. Su amiga le dice que es muy aburrida por no salir más.","¿Qué responde Marina?",["«Soy distinta, no aburrida»","Se siente mal y no dice nada"],["Se respeta a sí misma. Su amiga lo entiende.","Conocerse también es poder defender quién eres."]],
["Domingo. Marina piensa en todo lo que ha descubierto.","¿Qué siente?",["Que se entiende mejor","Que sigue siendo «rara»"],["Lo que llamaba «rareza» era personalidad.","No hay personalidades buenas o malas: hay formas de ser."]]],
end:{ok:"Marina dejó de verse como «rara» y empezó a entenderse. Conocerse le ayudó a elegir mejor: qué hacer, con quién y cómo cuidar su energía.",ko:"A Marina le costó mirar su personalidad sin juzgarse. La próxima vez, lee solo una de las cinco dimensiones y piensa si te reconoces."}}
};
// Curiosidades por área (en el mismo orden que AREAS)
const CUR=[
["Dormir menos de 6 horas durante dos semanas afecta a tu atención casi tanto como pasar una noche entera sin dormir. Y lo peor: casi no lo notas.","Mientras duermes, tu cerebro «limpia» desechos que se acumulan durante el día. Por eso piensas mejor tras una buena noche.","En la adolescencia el reloj interno se retrasa de forma natural: por eso te cuesta dormirte pronto. No es pereza, es biología.","Lo que estudias por la tarde se fija durante el sueño de esa noche. Trasnochar antes de un examen te quita justo ese repaso.","La luz de la mañana es la mejor forma de «poner en hora» tu reloj interno. Diez minutos al aire libre ya ayudan."],
["Después de 20 minutos de ejercicio, tu cerebro libera sustancias que mejoran el ánimo y la concentración durante horas.","Los músculos son como una «farmacia»: cuando los usas, liberan sustancias que reducen la inflamación y mejoran el ánimo.","No hace falta un gimnasio: subir escaleras, ir andando a clase o bailar en tu cuarto cuenta como actividad física.","Las personas que hacen ejercicio regular duermen mejor y se duermen antes.","La fuerza que ganes ahora te protege los huesos durante toda la vida: hasta los 25-30 años se forma casi toda tu masa ósea."],
["Tu intestino tiene cientos de millones de neuronas y habla sin parar con tu cerebro. Por eso lo llaman «el segundo cerebro».","Los ultraprocesados están diseñados para que sea difícil parar de comer: mezclan azúcar, grasa y sal en proporciones que el cerebro adora.","Beber agua cuando tienes sed es suficiente: lo de los 2 litros obligatorios es un mito.","Comer legumbres tres veces por semana es uno de los hábitos más sanos y baratos que existen.","El hambre emocional pide algo concreto y llega de golpe. El hambre física llega poco a poco y acepta casi cualquier comida."],
["Ponerle nombre a una emoción reduce la actividad de la amígdala, la zona del cerebro que se activa con el miedo. Nombrar calma.","Una emoción intensa sube como una ola y, si no la alimentas con más pensamientos, baja sola antes de lo que crees.","Llorar no es de débiles: libera tensión y ayuda al cuerpo a volver a la calma.","Las personas que distinguen bien sus emociones suelen llevar mejor el estrés y discutir menos.","Evitar lo que te da miedo lo hace crecer. Enfrentarlo poco a poco lo hace encoger."],
["Tienes miles de pensamientos al día, y algunos son negativos y se repiten. No hace falta creérselos todos.","Los psicólogos llaman «catastrofizar» a imaginar siempre lo peor. Casi todo el mundo lo hace a veces.","Escribir un pensamiento en papel lo hace más pequeño: lo ves desde fuera en lugar de estar dentro de él.","Tu cerebro recuerda más lo malo que lo bueno. Por eso un comentario negativo pesa más que diez elogios.","Hace 2.000 años, el filósofo Epicteto ya dijo que no nos afectan las cosas, sino lo que pensamos de ellas."],
["Un estudio encontró que crear un hábito tarda de media 66 días, no 21. Si te cuesta, es lo normal.","Cerca de la mitad de lo que haces cada día lo haces en piloto automático, por hábito.","Las personas con «mucha fuerza de voluntad» en realidad se exponen menos a tentaciones.","Planificar «si pasa X, haré Y» aumenta mucho las posibilidades de cumplir lo que te propones.","Fallar un día no rompe un hábito. Lo que lo rompe es fallar varios días seguidos."],
["Un estudio de Harvard que dura más de 80 años concluye que lo que más predice la felicidad son las buenas relaciones.","La soledad no deseada afecta a la salud tanto como algunos malos hábitos conocidos.","Hacer dos preguntas de seguimiento en una conversación hace que la otra persona se sienta mucho más escuchada.","Las parejas y amistades que duran no son las que no discuten, sino las que saben reconciliarse.","Decir «no» de vez en cuando hace que tus «sí» valgan más."],
["Las notificaciones están diseñadas con colores y sonidos que activan tu atención de forma casi automática.","Tras una interrupción, tu cerebro puede tardar varios minutos en volver a concentrarse del todo.","El scroll infinito se inventó para eliminar los «puntos de parada» que te harían cerrar la app.","Para mucha gente, el móvil a la vista es una tentación constante. Fuera de la vista, cuesta menos concentrarse.","Las rachas de las apps usan el miedo a perder algo para que entres cada día."],

function goodDays(a){let g=0;for(let k=0;k<7;k++){const v=a.log[addDays(a.start,k)];if(v==="si"||v==="poco")g++}return g}
function finishReto(next){const a=S.active,passed=goodDays(a)>=4;S.history.push({id:a.id,start:a.start,end:today(),plan:a.plan,log:a.log,rating:a.rating,finished:true,passed,skipped:next==="skip",sto:a.sto,myEnd:a.myEnd});
 if(passed&&next!=="repeat"&&S.keep.length<2&&!S.keep.some(k=>k.id===a.id))S.keep.push({id:a.id,log:{}});
 if(passed)S.sharePrompt=a.id;
 if(next==="repeat"){S.active={id:a.id,start:today(),plan:a.plan,log:{},rating:null}}else S.active=null;save()}
function suggestNext(){const sc=curScores();if(!sc)return [];const done=new Set(S.history.map(h=>h.id));

function radar(sc,prev){
  const cx=180,cy=180,R=125,pt=(i,v)=>{const ang=i/NA*Math.PI*2-Math.PI/2;return [cx+Math.cos(ang)*R*v/5,cy+Math.sin(ang)*R*v/5]};
  const rings=[1,2,3,4,5].map(v=>`<polygon points="${AREAS.map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("");
  const poly=s=>s.map((x,i)=>pt(i,x||0).join(",")).join(" ");
  const dots=sc.map((s,i)=>{if(s==null)return "";const [x,y]=pt(i,s||0);return `<circle cx="${x}" cy="${y}" r="5" fill="hsl(${AREAS[i].h} var(--as) var(--al))" stroke="var(--surface)" stroke-width="2"/>`}).join("");
  const labels=AREAS.map((a,i)=>{const ang=i/NA*Math.PI*2-Math.PI/2,x=cx+Math.cos(ang)*(R+24),y=cy+Math.sin(ang)*(R+24);const short=a.n.split(" ")[0];return `<text x="${x.toFixed(0)}" y="${(y+4).toFixed(0)}" text-anchor="${Math.abs(Math.cos(ang))<.2?"middle":Math.cos(ang)>0?"start":"end"}">${short}</text>`}).join("");
  return `<svg class="radar" viewBox="-80 0 520 360" role="img" aria-label="Gráfico de radar con tu puntuación por área">${rings}${prev?`<polygon points="${poly(prev)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>`:""}<polygon points="${poly(sc)}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.5"/>${dots}${labels}</svg>`;
}

ra y fruta, un cuarto proteína y un cuarto cereal integral o patata."], ["ALI-02", "¿Qué bebida acompaña al plato equilibrado?", "Agua", "Zumo natural, porque es fruta", "Refresco sin azúcar, porque no engorda", "El agua es la bebida de base; el resto, de vez en cuando."], ["ALI-03", "¿Cómo reconoces el hambre emocional?", "Llega de golpe y pide algo concreto", "Llega poco a poco y te vale cualquier comida", "Solo aparece a la hora de comer o de cenar", "Suele venir con aburrimiento, estrés o tristeza."], ["ALI-04", "¿Qué hace la fibra (legumbres, verdura, fruta)?", "Te sacia y cuida tu intestino", "Engorda más que el azúcar", "No tiene ninguna función: el cuerpo la expulsa sin más", "La fibra regula el apetito y alimenta a las bacterias buenas del intestino."], ["ALI-04", "¿Qué te sacia más?", "Huevos o legumbres", "Un refresco de cola bien frío", "Una bolsa grande de patatas fritas", "La proteína es lo que más sacia."], ["ALI-05", "¿Hacen falta zumos detox para limpiar el cuerpo?", "No: el hígado y los riñones ya hacen ese trabajo", "Sí, una vez al mes", "Sí, después de un fin de semana de comer mal", "El hígado y los riñones ya hacen ese trabajo. Los productos detox no aportan nada."], ["ALI-06", "¿Cuánto azúcar añadido lleva más o menos una lata de refresco?", "Unas 8 cucharaditas", "Media cucharadita", "Ninguna: el azúcar que lleva es el de la fruta", "Una sola lata supera lo que la OMS considera ideal para todo el día."], ["ALI-06", "Según la OMS, el azúcar añadido debería ser…", "Menos del 10 % de lo que comes", "Menos de la mitad de todo lo que comes al día", "No hay ningún límite: depende de cada persona", "Mejor aún, menos del 5 %: unas 6 cucharaditas al día."]], "EMO": [["EMO-01", "¿Por qué ayuda ponerle nombre exacto a lo que sientes?", "Nombrarlo ya ayuda a regularlo", "Hace que la emoción dure más", "No sirve para nada", "Saber qué sientes te dice qué necesitas."], ["EMO-01", "¿Qué frase es más precisa que «estoy mal»?", "«Me decepciona que no me eligieran»", "«Estoy fatal, de verdad, fatal»", "«Hoy todo me va mal y no sé por qué»", "Cuanto más concreto, más fácil saber qué hacer."], ["EMO-02", "Si sientes rabia…", "Tú decides qué haces con ella", "Estás obligado a soltarla aunque sea gritando a alguien", "Lo mejor es hacer como si no existiera y aguantarla", "Las emociones informan de algo, pero no te ordenan qué hacer."], ["EMO-03", "¿Qué pasa si evitas lo que te da miedo?", "Alivia en el momento y hace que el miedo crezca después", "Hace que el miedo desaparezca", "Es la mejor forma de superarlo", "Evitar alivia en el momento, pero el cerebro aprende que aquello era peligroso."], ["EMO-04", "¿Qué es la autocompasión?", "Tratarte como a un buen amigo", "Tenerte pena", "Ponerte excusas para no tener que esforzarte en mejorar", "No es rendirse: es hablarte con respeto cuando fallas."], ["EMO-04", "¿Qué motiva más después de un fallo?", "Ser amable contigo", "Machacarte para no volver a repetirlo nunca más", "Hacer como que no ha pasado y pasar a otra cosa", "La investigación de Kristin Neff muestra que la amabilidad motiva más que la crítica, y luego miras qué mejorar."], ["EMO-05", "¿Qué es rumiar?", "Dar vueltas a lo mismo sin llegar a nada", "Pensar con calma una solución", "Hablar de un problema con alguien", "Parece pensar, pero mantiene el malestar."], ["EMO-06", "Según Brené Brown, mostrar lo que sientes a personas de confianza…", "Es la base de las relaciones cercanas", "Es una debilidad que conviene esconder siempre", "Solo funciona en pareja", "Sin vulnerabilidad no hay relaciones cercanas de verdad."], ["EMO-07", "«Hay que pensar en positivo siempre.» ¿Es verdad?", "No: forzarlo aumenta el malestar", "Sí: así las emociones negativas desaparecen antes", "Sí, siempre que te lo repitas cada mañana en voz alta", "Aceptar las emociones difíciles ayuda a que pasen."], ["EMO-07", "Ante una emoción difícil, ¿qué ayuda a que pase antes?", "Aceptarla y dejarla estar mientras haces lo que importa", "Pelear contra ella hasta eliminarla", "Fingir delante de todos que estás bien", "Lo que resistes, persiste. Déjala estar mientras haces lo que importa."]], "PEN": [["PEN-01", "«Si suspendo este examen, mi vida está arruinada.» ¿Qué error de pensamiento es?", "Catastrofizar", "Leer la mente de los demás", "Pensar de forma realista con datos", "Imaginar el peor final como si fuera seguro."], ["PEN-01", "«Seguro que piensan que soy raro.» ¿Qué error de pensamiento es?", "Leer la mente", "Catastrofizar sobre el futuro", "Ser realista con lo que pasa", "Das por hecho lo que piensan otros sin pruebas."], ["PEN-02", "Si piensas «soy un desastre», ¿qué es cierto?", "No es un hecho: puedes observarlo sin creértelo", "Es verdad si lo piensas muchas veces seguidas", "Hay que discutirlo hasta ganarlo", "Puedes observar el pensamiento sin creértelo."], ["PEN-03", "¿Qué significa tener mentalidad de crecimiento?", "Que puedes mejorar practicando", "Que todo se consigue si lo deseas con mucha fuerza", "Pensar en positivo siempre", "Carol Dweck: las habilidades se desarrollan con práctica. El «todavía no» cambia mucho."], ["PEN-04", "Según los estoicos, ¿qué depende de ti?", "Tus actos", "Lo que los demás piensan de ti si te esfuerzas lo suficiente", "El resultado exacto de un examen si estudias mucho", "Tus actos y tu esfuerzo. Separar lo que controlas de lo que no ahorra mucho sufrimiento."], ["PEN-05", "¿Qué hace el sesgo de negatividad?", "Una crítica te pesa más que diez elogios", "Que recuerdes sobre todo lo bueno", "Que te dé igual lo que te digan", "Tu cerebro da más peso a lo malo."], ["PEN-06", "¿Cuál es la fórmula de Ray Dalio para aprender de los errores?", "Dolor + reflexión = progreso", "Error + olvido = tranquilidad", "Esfuerzo + suerte = éxito", "Un error es información si te paras a pensarlo."], ["PEN-07", "Según Epicteto, ¿qué nos perturba?", "Lo que pensamos de las cosas", "Lo que los demás nos hacen o nos dicen cada día", "La mala suerte y las cosas que no podemos cambiar", "«No nos perturban las cosas, sino lo que pensamos de ellas.» Es la base de la terapia cognitiva actual."], ["PEN-08", "¿Qué frase te ayuda más a mejorar?", "«He suspendido; cambiaré cómo estudio»", "«Soy tonto, no sirvo para esto»", "«Nunca se me dará bien»", "Describe lo que haces y ponte un siguiente paso; no te pongas etiquetas."], ["PEN-10", "¿Qué es el efecto foco?", "Creer que te miran más de lo que lo hacen", "Que los demás se fijan en todo lo que haces y lo comentan", "Que solo nos fijamos en lo bueno", "Los demás están ocupados pensando en sí mismos."]], "HAB": [["HAB-01", "¿Qué hace diferente a quien parece tener mucha fuerza de voluntad?", "Se expone a menos tentaciones", "Ha nacido con más voluntad que la mayoría de la gente", "Sufre más que los demás, pero aguanta sin quejarse", "El entorno pesa más que la voluntad."], ["HAB-01", "Para estudiar sin distraerte, ¿qué funciona mejor?", "Móvil en otra habitación", "Ponerlo boca abajo en la mesa, al lado de los apuntes", "Dejarlo a la vista para entrenar la fuerza de voluntad", "Tenerlo cerca, aunque esté boca abajo, ya roba atención."], ["HAB-02", "¿Cuáles son las tres partes de un hábito?", "Señal, rutina y recompensa", "Motivación, esfuerzo y fuerza de voluntad", "Objetivo, castigo si fallas y premio si cumples", "Para cambiar un hábito, detecta primero la señal."], ["HAB-03", "Si quieres empezar a leer, ¿qué funciona mejor al principio?", "Una página al día", "Un libro por semana a partir del lunes", "Esperar a tener ganas de verdad para empezar", "Primero la costumbre, luego más."], ["HAB-03", "James Clear propone reducir un hábito nuevo a…", "Dos minutos", "Dos horas el fin de semana", "Dos días por semana, como mucho", "Ponerte las zapatillas ya cuenta."], ["HAB-04", "¿Qué es sobre todo la procrastinación?", "Evitar una emoción desagradable", "Pereza", "Falta de inteligencia o de capacidad para organizarse", "Aplazas para no sentir aburrimiento o miedo a hacerlo mal."], ["HAB-05", "¿Para qué sirve decidir «si pasa X, haré Y»?", "Para fijar cuándo y dónde", "Para castigarte cada vez que no cumples lo que dijiste", "Para acordarte de todo lo que hiciste el día anterior", "Planificar el cuándo y el dónde duplica la probabilidad de hacerlo."], ["HAB-06", "Según un estudio, ¿cuánto tarda de media un hábito en volverse automático?", "Unos 66 días, con mucha variación", "21 días exactos", "Una semana", "Con mucha variación según la persona. Lo de los 21 días es un mito."], ["HAB-07", "¿En qué consiste la regla de los 5 segundos de Mel Robbins?", "Contar 5-4-3-2-1 y moverte", "Esperar cinco segundos antes de responder a alguien enfadado", "Estudiar 5 minutos al día", "Te mueves antes de que tu cabeza busque excusas. Es un truco para arrancar, no para tener ganas."], ["HAB-08", "¿Qué es la falacia de la planificación?", "Calcular menos tiempo del que necesitas", "Creer que planificar las tareas te hace perder el tiempo", "Pensar que las tareas duran siempre justo lo que calculas", "Por eso los trabajos se acaban la noche antes."]], "REL": [["REL-01", "Según el estudio de Harvard de más de 80 años, ¿qué predice mejor una vida sana y feliz?", "Tus relaciones", "El dinero", "La fama", "Robert Waldinger: la calidad de las relaciones nos mantiene más sanos y felices."], ["REL-02", "¿Cuál es la fórmula de la comunicación asertiva?", "Hecho + cómo me siento + qué necesito", "Reproche + subir el tono + silencio", "Callarte para no molestar a nadie", "Decir lo que necesitas sin atacar ni callarte."], ["REL-02", "¿Qué frase es asertiva?", "«Si llegas tarde sin avisar, me agobio. Escríbeme»", "«Siempre llegas tarde, eres un desastre total»", "No decir nada y enfadarte por dentro durante días", "Hablas del hecho y de ti, sin atacar a la persona."], ["REL-03", "¿Qué es poner un límite?", "Decir lo que tú vas a hacer, sin controlar al otro", "Una forma de castigar a alguien que te ha molestado", "Algo que solo vale si lo justificas muy bien", "Un límite habla de lo que tú vas a hacer, no de controlar al otro. «No me apetece» es razón suficiente."], ["REL-04", "¿Qué pasa con los estilos de apego (seguro, ansioso, evitativo)?", "Se aprenden y pueden cambiar", "Son fijos para toda la vida", "Solo existen en la infancia y luego desaparecen", "Se aprenden, y las relaciones sanas ayudan a ganar seguridad."], ["REL-05", "¿Qué es escuchar de verdad?", "Escuchar para entender", "Esperar con paciencia a que llegue tu turno para hablar", "Dar consejos rápidos para solucionarle el problema", "No para responder. Pregunta más, interrumpe menos."], ["REL-06", "¿Qué tienen las amistades y parejas que duran?", "Saben arreglarlo después de discutir", "Nunca discuten", "Evitan hablar de lo que molesta", "Lo importante es reparar, no no discutir nunca."], ["REL-07", "Revisar el móvil de tu pareja o pedirle la ubicación todo el rato es…", "Control", "Una prueba de amor y de que te importa", "Normal si la quieres y te preocupas por ella", "No es amor: es control. Si te pasa, mira la sección Ayuda."], ["REL-08", "¿Cuándo vale un sí?", "Si es libre y se puede cambiar de idea", "Cuando esa persona ya dijo que sí otra vez antes", "Cuando no dice que no, aunque no diga nada", "Hay que saber a qué se dice sí. Con presión, miedo o alcohol de por medio no es un sí libre."], ["REL-09", "¿Qué es el error de atribución?", "Explicar lo tuyo por las circunstancias y lo de los demás por su forma de ser", "Atribuirte los méritos de un trabajo en grupo", "Echarte siempre la culpa de todo lo que sale mal", "Tú llegas tarde por el autobús; el otro, por irresponsable."]], "ATE": [["ATE-01", "El scroll infinito, las notificaciones y las rachas…", "Están diseñados para engancharte", "Son casualidad", "Existen para ayudarte a descansar y desconectar", "No es solo falta de voluntad: hay equipos enteros diseñándolo para quedarse con tu tiempo."], ["ATE-01", "Tristan Harris trabajó en Google. ¿De qué avisa?", "De que la tecnología se diseña para captar tu atención", "De que los móviles emiten una radiación peligrosa para el cerebro", "De que hay que dejar internet para siempre y volver al papel", "Su charla explica cómo unas pocas empresas diseñan para engancharte."], ["ATE-02", "¿Qué pasa si estudias y miras el móvil a la vez?", "Tu cerebro alterna, y cada cambio cuesta tiempo y errores", "Haces dos cosas a la vez sin perder nada", "Mejora tu memoria porque el cerebro trabaja más", "El cerebro no hace multitarea: alterna, y cada cambio cuesta."], ["ATE-02", "Después de una interrupción (una notificación)…", "Tardas en volver a concentrarte", "Vuelves al instante al mismo nivel de concentración", "Te concentras mejor que antes", "Cada interrupción tiene un coste de vuelta."], ["ATE-03", "¿Se puede mejorar la atención?", "Sí, se entrena", "No, es algo fijo con lo que se nace", "Solo con bebidas energéticas o suplementos", "Amishi Jha muestra que unos minutos al día atendiendo a la respiración ya ayudan."], ["ATE-04", "Cuando te comparas en redes…", "Comparas tu día normal con los mejores momentos editados de otros", "Ves cómo es de verdad la vida de los demás", "Siempre te motiva a mejorar y a esforzarte más", "Comparas tu día normal con los mejores momentos editados de otros."], ["ATE-05", "¿En qué consiste el trabajo profundo?", "Concentrarte sin interrupciones", "Trabajar muchas horas seguidas con el móvil al lado", "Hacer varias cosas a la vez", "Cal Newport: lo que más importa necesita bloques largos sin distracciones."], ["ATE-06", "«Un día sin hacer nada resetea la dopamina.» ¿Es verdad?", "No", "Sí, por eso se llama «detox de dopamina»", "Sí, pero solo si lo haces en domingo y sin móvil", "La dopamina no se vacía ni se reinicia. Lo que funciona es dejar un tiempo la cosa concreta que te engancha."], ["ATE-07", "Según Anna Lembke, ¿qué pasa cuanto más placer fácil consumes (scroll, vídeos cortos)?", "Menos te llena y más malestar notas después", "Más feliz eres", "Más se recarga tu cerebro", "El cerebro compensa inclinando la balanza hacia el malestar."], ["ATE-07", "¿Qué propone Lembke para recuperar el gusto por las cosas normales?", "Dejar esa cosa concreta un tiempo (unas semanas)", "Usarla aún más para saturarte", "Cambiarte a otra app parecida pero con menos anuncios", "Ella propone unos 30 días sin eso que te engancha."]], "EST": [["EST-01", "¿Qué estrés es el problema?", "El constante", "El de antes de un examen o un partido importante", "Cualquier tipo de estrés, siempre y en todo momento", "El estrés puntual te prepara; el constante, sin descanso, te desgasta."], ["EST-02", "Según Kelly McGonigal, ¿qué pasa si ves el corazón acelerado como preparación?", "Mejora el rendimiento", "No cambia nada", "Lo empeora", "Cómo interpretas los nervios cambia cómo te afectan."], ["EST-02", "Antes de un examen notas nervios. ¿Qué te ayuda más a rendir?", "Pensar «me estoy preparando»", "Decirte «tengo que calmarme ya mismo como sea»", "Intentar no sentir nada", "Reinterpretar los nervios funciona mejor que luchar contra ellos."], ["EST-03", "Para calmar el cuerpo en el momento, ¿qué funciona?", "Soltar el aire despacio", "Respirar muy rápido varias veces seguidas", "Aguantar la respiración todo lo que puedas", "Espirar lento activa el freno del cuerpo."], ["EST-04", "¿Por qué conviene decidir las cosas antes del estrés?", "Con estrés pensamos peor", "Porque el estrés te hace más listo y lo complica todo", "No conviene: improvisar en el momento siempre sale mejor", "Prever qué puede fallar te ahorra decisiones malas."], ["EST-04", "Daniel Levitin propone imaginar antes qué puede salir mal. ¿Para qué?", "Para tenerlo preparado", "Para preocuparte más", "Para tener una excusa si al final sale mal", "Ejemplo: un sitio fijo para las llaves y el DNI."], ["EST-05", "¿Qué descansa de verdad?", "Ejercicio, naturaleza, gente y sueño", "Horas de scroll tumbado en el sofá", "Seguir estudiando, pero más despacio", "El scroll entretiene, pero no siempre recupera."], ["EST-06", "¿Quién supera mejor las crisis?", "Quien pide ayuda", "Quien aguanta solo sin molestar a nadie", "Quien no se lo cuenta a nadie para no preocupar", "Ser fuerte no es aguantar solo."], ["EST-07", "Elegir pequeñas incomodidades (ir andando, aburrirte sin móvil)…", "Te entrena para lo difícil", "Es sufrir sin sentido", "Solo sirve a los deportistas de alto nivel", "Te prepara para las incomodidades que no eliges. Es una práctica estoica clásica."], ["EST-08", "¿Qué pasa con el ocio que eliges (música, dibujar, cocinar)?", "Recarga más", "Es una pérdida de tiempo si no te da dinero o notas", "No descansa tanto como ver vídeos en el móvil", "Recarga más que el ocio que te arrastra. Y no tiene que servir para nada."]], "VAL": [["VAL-01", "¿Qué diferencia hay entre valores y metas?", "Los valores son tu dirección; las metas, destinos concretos", "Son lo mismo dicho con palabras distintas", "Las metas importan más, los valores son solo ideas", "Una meta se cumple; un valor se vive."], ["VAL-01", "¿Cuál de estas cosas es un valor?", "Aprender", "Aprobar las mates en junio", "Sacarme el carné antes del verano", "Las otras dos son metas concretas."], ["VAL-02", "Según Emily Esfahani Smith, ¿con qué se construye el sentido?", "Pertenencia y propósito", "Con mucho dinero y reconocimiento de los demás", "Con estar contento y de buen humor todo el tiempo", "Pertenencia, propósito y la historia que te cuentas de tu vida. Buscar sentido llena más que buscar felicidad."], ["VAL-03", "¿Qué significa liderazgo sin cargo?", "Tomar la iniciativa y mejorar lo que te rodea sin tener un puesto", "Mandar a los demás aunque nadie te lo haya pedido", "Esperar a que te elijan delegado para actuar", "Cualquiera puede mejorar lo que le rodea."], ["VAL-04", "¿Qué pasa con lo importante (salud, gente, aprender)?", "Si no lo planificas, desaparece", "Siempre es urgente", "Se acaba haciendo solo, sin tener que pensarlo", "Lo importante casi nunca grita; lo urgente se lo come si no lo reservas."], ["VAL-05", "¿A qué se asocia ayudar a otros?", "A más bienestar", "A tener menos tiempo para ti y más malestar", "A nada: ayudar no tiene efecto en quien ayuda", "Aportar a los demás también te da sentido y te hace bien a ti."], ["VAL-06", "«Encuentra tu pasión y luego ve a por ella.» ¿Es buen consejo?", "No: la pasión suele aparecer después de hacerte bueno en algo", "Sí: hay que sentirla antes de empezar cualquier cosa", "Sí, aunque solo la tienen algunas personas", "La pasión suele aparecer después de hacerte bueno en algo."], ["VAL-07", "¿Cómo se descubre lo que te gusta?", "Probando cosas", "Pensándolo mucho tiempo a solas en tu habitación", "Haciendo un test de internet que te lo diga", "Un taller, un voluntariado, un curso gratis, hablar con alguien de un oficio…"], ["VAL-08", "¿Cuándo baja el miedo al ridículo?", "Al exponerte poco a poco", "Cuando evitas siempre las situaciones que te dan vergüenza", "Cuando esperas a estar totalmente seguro antes de probar", "El peor caso real casi nunca es tan grave como imaginas."], ["VAL-10", "¿Qué quiere decir «el obstáculo es el camino»?", "No eliges lo que te pasa, pero sí cómo respondes", "Hay que evitar todos los obstáculos", "Los problemas son mala suerte", "No eliges lo que te pasa, pero sí cómo respondes. Cada problema es materia prima para crecer."]], "DIN": [["DIN-01", "¿Qué significa «págate primero»?", "Guardar nada más cobrar, de forma automática", "Darte un capricho al cobrar", "Pagar primero a los amigos y luego tus gastos", "Guardar de forma automática al cobrar. Si ahorras lo que sobra, nunca sobra."], ["DIN-02", "Con el interés compuesto, ¿cuál es tu mayor ventaja a los 16 años?", "El tiempo", "Tener mucho dinero para empezar a invertir", "Saber elegir las acciones que más van a subir", "Empezar pronto con poco gana a empezar tarde con mucho."], ["DIN-03", "¿A qué se parecen las cajas sorpresa de los videojuegos?", "A una tragaperras: premio al azar", "A una tienda normal", "A una hucha", "Pagas sin saber qué te toca: premio al azar, y eso engancha."], ["DIN-26", "Has perdido cinco veces seguidas en la ruleta. ¿Qué pasa en la siguiente?", "Lo mismo: el azar no recuerda", "Seguro que ganas", "Es más fácil perder, porque estás en racha mala", "Creer que «ya te toca» es la falacia del jugador."], ["DIN-11", "Te prometen ganar un 20 % al mes sin riesgo. ¿Qué es?", "Una estafa", "Una buena oportunidad si entras rápido antes que los demás", "Algo normal en cripto si sabes elegir bien la moneda", "Las ganancias altas siempre van con riesgo. Mucho, rápido y sin riesgo es la señal de alarma."], ["DIN-09", "Si dejas 1.000 € parados en un cajón 10 años, con inflación…", "Comprarás menos con ellos", "Valdrán más", "Valdrán lo mismo", "Los precios suben y el dinero parado pierde poder de compra."], ["DIN-13", "¿Qué es un fondo indexado?", "Uno que compra todo un índice", "Un fondo que elige solo las mejores empresas del momento", "Uno que garantiza que no pierdes", "Compra a la vez todas las empresas de un índice, con comisiones bajas. A largo plazo, la mayoría de profesionales no lo supera."], ["DIN-14", "¿Qué pasa con una comisión del 2 % al año?", "A 30 años, se lleva mucho", "Es tan poco que no se nota en el resultado final", "Solo se paga el primer año y luego desaparece", "Pruébalo en el simulador de la pestaña Dinero."], ["DIN-16", "En una nómina, ¿qué es el neto?", "Lo que cobras tras el IRPF y la Seguridad Social", "Lo que pactas con la empresa antes de impuestos", "Lo que la empresa le paga a Hacienda por ti", "El bruto es lo pactado; el neto, lo que cobras tras el IRPF y la Seguridad Social."], ["DIN-24", "1,50 € al día en caprichos, ¿cuánto son al año más o menos?", "Unos 550 €", "Unos 50 €", "Unos 5.000 €", "1,50 × 365 = 547,50 €."]], "EDU": [["EDU-01", "¿Cuál es la técnica de estudio con más evidencia?", "Hacerte preguntas", "Releer los apuntes varias veces seguidas", "Subrayar con colores lo más importante", "Practicar recordando: sacar de la memoria es lo que la fija."], ["EDU-01", "Antes de un examen, ¿qué    <div id="interes" style="scroll-margin-top:80px"><p class="eyebrow">Para tu futuro</p><h2>El poder de empezar pronto</h2><p class="muted" style="margin-top:8px;max-width:62ch">Esto es para más adelante, cuando tengas tus propios ingresos, pero conviene saberlo ya. Mueve los controles y mira qué pasa si guardas un poco cada mes y lo inviertes a largo plazo. La rentabilidad es un ejemplo: invertir no garantiza ganancias y hay años con pérdidas.</p></div>

   ["Elegid un reto entre todos. Aquí abajo tenéis cuatro ideas.","Cada uno lo empieza en su propia app.","Apunta aquí quién participa.","El viernes, la app te pregunta cómo ha ido: mandas tu resultado al grupo, marcas quién lo ha cumplido y la app os lo celebra.","5 minutos para hablarlo: ¿qué os ha costado? ¿qué os ha funcionado?"],

["Si en Explorar veo algo que me interesa, ¿puedo hacerlo?","Puedes leerlo todo, con ejemplos y vídeos, cuando quieras. Pero no puedes convertirlo en tu reto: los retos salen de tu ruta, uno cada vez, para que trabajes tus áreas con más margen. Cuando repitas el test, tu ruta cambiará según cómo estés."],
["¿Puedo hacer más de un reto a la vez?","No: uno cada vez, para no agobiarte. Tus 3 áreas prioritarias se van turnando, una por semana. Cuando superas un reto, puedes seguir marcando ese hábito (hasta 2) mientras haces el siguiente."],
["¿Qué es la versión mínima?","La forma más pequeña de tu reto, para los días difíciles. Por ejemplo, si tu reto es dejar el móvil 30 minutos antes de dormir, la versión mínima es dejarlo 10. Si la haces, marca «Un poco»: cuenta para superar el reto y mantiene tu racha."],
["¿Cuándo paso al nivel 2?","Cada área tiene 3 retos básicos. Cuando terminas los 3 de un área (superados o saltados), se abre su nivel 2. Lo ves en la pestaña Ruta."],
["¿La app me avisa cada día?","No puede enviarte notificaciones. Por eso el primer día eliges una hora y pones una alarma en tu móvil llamada «Brújula»."]]],
["Ruta, puntos y niveles",[
["¿Qué es mi ruta?","El orden de tus retos, sacado de tus 3 áreas prioritarias. Tiene dos niveles: primero lo básico y después un paso más. La ves completa en la pestaña Ruta."],
["¿Para qué sirven los puntos?","Para que veas tu esfuerzo. Sí +10 · Un poco +6 · Hoy no +2 · Plan +5 · Valorar la semana +20 · Repetir el test +25. Con los puntos subes de etapa: Arranque, En ruta, Travesía, Expedición y Cumbre."],
["¿Hay ranking con mis compañeros?","No, y no lo habrá. Cada persona va a su ritmo. Compararse aquí no ayuda."]]],
["Propósito",[
["¿Qué es la pestaña Propósito y para qué sirve?","Siete pasos cortos (uno por semana, unos 5 minutos, casi todo tocando opciones) para descubrir qué te importa, en qué eres bueno y a quién te gustaría aportar. Al final tienes tu frase de propósito, que te ayuda a elegir estudios, trabajo o planes con más criterio y da sentido a tus retos. Es opcional, pero muy recomendable."],
["¿Tengo que saber ya a qué me quiero dedicar?","No. Casi nadie lo sabe a tu edad. El propósito no se encuentra de golpe: se descubre probando cosas. Para eso están los experimentos."],
["¿Puedo cambiar mi frase?","Sí. Cada mes la app te pregunta si sigue siendo tu frase. Cambiarla es normal: significa que te conoces mejor."]]],
["Historias, curiosidades y extras",[
["¿Qué es «Para aprender hoy» y es obligatorio?","No es obligatorio. Es una tarjeta en Hoy, debajo de tu reto, que cambia cada día. Si tu reto tiene historia, lees un capítulo de un minuto y decides qué hace el protagonista; el día 7 ves el final y eliges el tuyo. Si no, ves una curiosidad de tu área. Sirve para aprender algo útil sin esfuerzo y entender mejor por qué funciona tu reto."],
["¿Qué son los sesgos?","Errores de pensamiento que tenemos todos, como creer solo lo que nos da la razón o pensar que todo el mundo se fija en nosotros. Conocerlos te hace más difícil de engañar. En Explorar, toca «Ver solo los sesgos»."],
["¿Y las ideas extra que salen en Hoy?","Son misiones opcionales: respirar un minuto, ver un vídeo, un concepto nuevo… Si te apetece, adelante. Si no, «Por hoy está bien»."],
["¿Cómo funciona lo del compañero de retos?","Eliges a alguien de confianza y la app te prepara un mensaje para enviárselo por WhatsApp. La app no le envía nada: lo envías tú. Los viernes te prepara otro para contarle cómo vas."]]],
["Problemas técnicos",[
["Ha desaparecido mi progreso. ¿Qué ha pasado?","Seguramente la has abierto desde otro navegador, en modo incógnito o desde dentro de Instagram o WhatsApp. Ábrela siempre igual, en Chrome o Safari. Si guardaste tu código de copia, recupéralo en Más."],
["La he añadido a la pantalla de inicio y me pide el test otra vez. ¿Por qué?","En algunos móviles, sobre todo iPhone, la app que abres desde el icono guarda sus datos aparte del navegador, así que no ve lo que hiciste allí. No has perdido nada: abre Brújula en el navegador, ve a Más → Copia de seguridad → Ver mi código y cópialo. Luego ábrela desde el icono, ve a Más y pégalo en «Recuperar mi progreso». A partir de ahí, úsala siempre desde el icono."],
["Voy a cambiar de móvil. ¿Pierdo todo?","No, si antes copias tu código en Más → Copia de seguridad y lo guardas en tus notas. En el móvil nuevo, pégalo en «Recuperar mi progreso»."],
["¿Cómo la pongo en la pantalla de inicio y cuándo?","Antes de hacer el test. En iPhone: en Safari, botón Compartir (si no lo ves, toca antes «···») y «Añadir a pantalla de inicio». En Android: en Chrome, los tres puntos (⋮) y «Añadir a pantalla de inicio» o «Instalar app». Después cierra el navegador y ábrela siempre desde el icono. No se descarga nada ni pide permisos: es un acceso directo a la web, y se actualiza sola."],
["Si borro el icono, ¿pierdo mi progreso?","En iPhone, sí: al borrar el icono se borran sus datos. Antes de borrarlo, copia tu código en Más → Copia de seguridad."],
["Llevo días sin entrar. ¿Tengo que empezar de cero?","No. Al volver, la app te da la bienvenida y te deja seguir donde lo dejaste o empezar la semana de nuevo."]]],
["Si no estoy bien",[
["¿Brújula sustituye a un psicólogo?","No. Te ayuda a conocerte y a crear hábitos, pero no sustituye a una persona que te escuche. Si lo estás pasando mal, habla con tu tutor, orientación, tu médico o llama a uno de los teléfonos de Ayuda."]]]

function faqFilter(){const q=(S.faqQ||"").trim().toLowerCase();let any=false;
  document.querySelectorAll(".faqg").forEach(g=>{let vis=0;g.querySelectorAll(".faq").forEach(d=>{const m=!q||d.textContent.toLowerCase().includes(q);d.style.display=m?"":"none";if(m)vis++;if(q&&m)d.open=true});g.style.display=vis?"":"none";if(vis)any=true});
  const n=document.getElementById("faqnone");if(n)n.style.display=any?"none":""}

function pReadExp(){S.P.exp.forEach((x,i)=>{const el=document.getElementById("p-exp"+i);if(el)x.t=el.value.trim()})}
function pReadFields(){const g=id=>{const el=document.getElementById(id);return el?el.value:null};const P=S.P;
  [["p-s3","s3"],["p-up","up"],["p-down","down"],["p-flow","flow"],["p-who","who"],["p-letter","letter"]].forEach(([id,k])=>{const v=g(id);if(v!==null)P[k]=v});

  if(t.dataset.lat){S.lat[t.dataset.lat]=parseFloat(t.value);const id=t.id;render();const n=document.getElementById(id);n&&n.focus()}
  if(t.dataset.sim){S.sim[t.dataset.sim]=parseFloat(t.value);const id=t.id;render();const n=document.getElementById(id);n&&n.focus()}
});
