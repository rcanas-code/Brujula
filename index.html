<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14222E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Brújula">
<meta name="description" content="Conócete, ponle nombre a lo que te pasa y mejora con un reto pequeño cada semana.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='white' stroke='%2314222E' stroke-width='3'/%3E%3Cpath d='M20 7 L25 20 L20 33 L15 20 Z' fill='%23FF6B3D'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Brújula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: app de una columna (máx. 960px) con navegación inferior en móvil y superior en escritorio; cada área tiene su propio tono. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#E7EEF2; --ink:#14222E; --muted:#56687A; --line:#D3DEE5;
  --accent:#FF6B3D; --accent-ink:#FFFFFF; --brand:#14506B;
  --good:#2E8B57; --good-bg:#DDF2E5; --warn:#C27A0E; --warn-bg:#FCEFD6; --bad:#C8423A; --bad-bg:#FBE1DE;
  --as:68%; --al:46%; --ab:92%;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E171F; --surface:#16222D; --surface-2:#1F2E3B; --ink:#E9F0F4; --muted:#9DB0BF; --line:#2A3B4A;
  --accent:#FF8358; --accent-ink:#1A0E08; --brand:#7CC3E0;
  --good:#5CC98A; --good-bg:#16352A; --warn:#F0B04A; --warn-bg:#3A2D14; --bad:#F07A70; --bad-bg:#3D1D1B;
  --as:60%; --al:62%; --ab:22%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171F; --surface:#16222D; --surface-2:#1F2E3B; --ink:#E9F0F4; --muted:#9DB0BF; --line:#2A3B4A;
  --accent:#FF8358; --accent-ink:#1A0E08; --brand:#7CC3E0;
  --good:#5CC98A; --good-bg:#16352A; --warn:#F0B04A; --warn-bg:#3A2D14; --bad:#F07A70; --bad-bg:#3D1D1B;
  --as:60%; --al:62%; --ab:22%; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.4rem,4vw,1.9rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin-inline:auto}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.area{--c:hsl(var(--h) var(--as) var(--al));--cb:hsl(var(--h) 70% var(--ab))}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.35rem}
.logo svg{width:34px;height:34px}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.92rem;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){
  .top .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;border-width:1px 0 0;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .nav button{padding:8px 6px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px}
}
.nav svg{width:20px;height:20px;display:none}
@media (max-width:760px){.nav svg{display:block}}

.view{padding-block:12px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;padding-block:20px}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:52ch;margin-block:14px 22px}
.hero-art{position:relative;aspect-ratio:1;max-width:100%}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-art{max-width:300px;margin-inline:auto}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:700;background:var(--cb);color:var(--ink);border:1px solid transparent}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
button.chip{border-color:var(--line);background:var(--surface)}
button.chip[aria-pressed="true"]{background:var(--cb);border-color:var(--c)}

/* Test */
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s ease}
.qhead{display:flex;align-items:center;gap:14px}
.badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;font-size:1.2rem;flex:none}
.q{display:flex;flex-direction:column;gap:12px;padding-block:18px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q p{font-weight:600;font-size:1.05rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 0;font-family:var(--display);font-weight:800;font-size:1.15rem;transition:transform .12s ease}
.scale button:hover{transform:translateY(-2px)}
.scale button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.scale-labels{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}

/* Map */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.radar text{font-family:var(--body);font-size:11px;fill:var(--muted);font-weight:700}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,130px) 1fr 44px;gap:10px;align-items:center;font-size:.92rem}
.bar .track{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--c);border-radius:999px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.pill.p{background:var(--bad-bg);color:var(--bad)} .pill.m{background:var(--warn-bg);color:var(--warn)} .pill.f{background:var(--good-bg);color:var(--good)}
.alert{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad);border-radius:var(--r);padding:16px 18px}
.alert strong{color:var(--bad)}
.example{background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-weight:600}
.prio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.prio{grid-template-columns:1fr}}
.prio .card{border-top:6px solid var(--c)}
.big{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}

/* Plan */
.ring{width:110px;height:110px;flex:none}
.ring circle{fill:none;stroke-width:12}
.task{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.check{width:40px;height:40px;border-radius:12px;border:2px solid var(--c);background:var(--surface);display:grid;place-items:center}
.check svg{width:22px;height:22px;opacity:0}
.check[aria-pressed="true"]{background:var(--c)}
.check[aria-pressed="true"] svg{opacity:1}
.task.done h3{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.challenge{background:var(--cb);border-radius:12px;padding:10px 12px;font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.92rem;font-weight:700}

/* Explore */
.search{width:100%;padding:14px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cc{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cc:hover{border-color:var(--c)}
.cc .top2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ev{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ev.F{color:var(--good)} .ev.M{color:var(--warn)} .ev.D{color:var(--muted)} .ev.X{color:var(--bad)}
.feel{display:flex;flex-direction:column;gap:10px}
.feel button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.feel button:hover{border-color:var(--c)}
.feel .name{font-weight:800;color:var(--c)}

/* Dialog */
dialog{border:0;border-radius:22px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgb(10 20 30 / .55)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px;border-top:8px solid var(--c)}
.dlg h4{margin:0;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Money */
.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:600px){.sliders{grid-template-columns:1fr}}
.sl label{display:flex;justify-content:space-between;font-weight:700;gap:8px}
.sl output{font-family:var(--display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:600px){.kpis{grid-template-columns:1fr}}
.kpi{border-radius:16px;padding:16px;background:var(--surface-2)}
.kpi.hot{background:var(--accent);color:var(--accent-ink)}
.kpi.hot .eyebrow{color:inherit;opacity:.85}
.chart{overflow-x:auto}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;font-weight:700}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* Help */
.phones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.phone{border-radius:16px;padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.phone .num{font-family:var(--display);font-weight:800;font-size:1.6rem;user-select:all}
.phone.urgent{border:2px solid var(--bad)}
.foot{font-size:.85rem;color:var(--muted);padding-block:24px}
.helpbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bad);color:var(--bad);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:.9rem}
.helpbtn svg{width:18px;height:18px}
/* Propósito */
.north{border-radius:22px;padding:22px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;gap:10px}
.north .eyebrow{color:inherit;opacity:.75}
.north p.sent{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,3.6vw,1.7rem);line-height:1.25;text-wrap:balance}
.north .btn.ghost{color:var(--bg);border-color:currentColor}
.north em{font-style:normal;color:var(--accent)}
.psteps{display:flex;flex-direction:column;gap:12px}
.pstep{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pstep>button{width:100%;border:0;background:transparent;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px;text-align:left}
.pnum{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--surface-2)}
.pstep.ok .pnum{background:var(--accent);color:var(--accent-ink)}
.pbody{padding:0 16px 18px;display:flex;flex-direction:column;gap:12px}
textarea.field{min-height:110px;resize:vertical}
.why{font-size:.9rem;border-left:3px solid var(--accent);padding-left:10px}
.breath{width:130px;height:130px;border-radius:50%;background:var(--cb);border:3px solid var(--c);margin:8px auto;animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%{transform:scale(.55)}40%{transform:scale(1)}100%{transform:scale(.55)}}
@media (prefers-reduced-motion:reduce){.breath{animation:none;transform:none}}
details.card summary{cursor:pointer;font-weight:800;list-style:none}
details.card summary::-webkit-details-marker{display:none}
.quiz{display:flex;flex-direction:column;gap:8px}
.quiz button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;font-weight:700}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps3 div{border-radius:14px;padding:10px 12px;background:var(--surface-2);font-size:.85rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.steps3 div b{font-family:var(--display);font-size:1rem}
.steps3 div.on{background:var(--c);color:#fff}
.steps3 div.done{background:var(--cb)}
.guide{border:2px solid var(--brand);border-radius:18px;padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.guide .eyebrow{color:var(--brand)}
.onb{display:flex;gap:6px;align-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.onb span{padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.onb span.on{background:var(--brand);color:var(--bg)}
.day{border-radius:22px;padding:20px;background:var(--surface);border:2px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.day.ok{border-color:var(--good);background:var(--good-bg)}
.day h2{font-size:1.4rem}
.todo{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg)}
.todo .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--accent)}
.todo.done .ic{background:var(--good);border-color:var(--good)}
.todo.done .ic svg{opacity:1}
.todo .ic svg{width:18px;height:18px;opacity:0}
.todo.opt .ic{border:3px dashed var(--brand)}
.todo.later .ic{border:3px dashed var(--line)}
.todo.done b{text-decoration:line-through;color:var(--muted)}
.todo small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.todo .btn{padding:8px 14px;font-size:.88rem}
.nav button{position:relative}
.nav .dot{position:absolute;top:4px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
/* Hoy */
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:600px){.status{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.status .big{font-size:1.6rem}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat svg{width:22px;height:22px}
.lvl{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:4px}
.lvl span{display:block;height:100%;background:var(--accent)}
.today{border:2px solid var(--c);border-radius:22px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:16px}
.daytag{display:inline-flex;gap:6px;align-items:center;background:var(--c);color:#fff;font-weight:800;border-radius:999px;padding:4px 12px;font-size:.85rem;width:max-content}
.checkin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.checkin button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 6px;font-weight:800;font-family:var(--display);font-size:1.05rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.checkin button small{font-family:var(--body);font-weight:600;font-size:.75rem;color:var(--muted)}
.checkin button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.checkin button[aria-pressed="true"] small{color:#fff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);font-weight:700;padding:0}
.week i{width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:block}
.week i.si{background:var(--c);border:2px solid var(--c)}
.week i.poco{background:var(--cb);border:2px solid var(--c)}
.week i.no{background:var(--surface-2);border:2px solid var(--muted)}
.week i.hoy{outline:3px solid var(--accent);outline-offset:2px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bdg{border-radius:16px;padding:14px 10px;text-align:center;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem;font-weight:700}
.bdg svg{width:40px;height:40px}
.bdg.off{opacity:.38;filter:grayscale(1)}
.share{background:var(--surface-2);border-radius:12px;padding:12px;font-weight:600;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30}
.minis{display:flex;flex-direction:column;gap:8px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.mini span{min-width:0}
.mini .btn{padding:8px 14px;font-size:.88rem;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.96);opacity:.6}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M20 7 L25 20 L20 33 L15 20 Z" fill="var(--accent)"/><path d="M20 20 L25 20 L20 33 L15 20 Z" fill="var(--ink)"/></svg>
      Brújula
    </div>
    <div class="row" style="gap:8px"><nav class="nav" id="nav" aria-label="Secciones"></nav><button class="helpbtn" data-go="ayuda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>Ayuda</button></div>
  </header>
  <main id="app"></main>
  <p class="foot">Brújula es una orientación para conocerte, no un diagnóstico. Tus respuestas se guardan solo en este dispositivo. Si lo estás pasando mal, mira la sección Ayuda.</p>

["SUE-01","Deuda de sueño","Dormir menos de lo que necesitas se acumula y lo notas como irritabilidad, peor memoria y más hambre. A tu edad necesitas entre 8 y 10 horas.","Apunta 7 días a qué hora te acuestas y te levantas. Calcula tu media real.","B","F","walker","Por qué dormimos (Matthew Walker)"],
["SUE-02","Horario regular","Acostarte y levantarte a horas parecidas todos los días, también el fin de semana, pone en hora tu reloj biológico.","Fija una hora de levantarte para los 7 días y respétala aunque hayas dormido mal.","B","F","foster","Diary of a CEO: Matthew Walker"],
["SUE-03","Luz de mañana, pantallas de noche","La luz natural por la mañana te despierta; el contenido de la pantalla por la noche te mantiene activo y retrasa el sueño.","Sal 10 minutos a la luz por la mañana y deja el móvil fuera del cuarto 30 minutos antes de dormir.","B","M","walker","Por qué dormimos (Matthew Walker)"],
["SUE-04","Cafeína y alcohol","Un café, una cola o una bebida energética por la tarde siguen activos a medianoche. El alcohol fragmenta el sueño.","Una semana sin cafeína después de las 14:00. Anota cómo te levantas.","I","F","foster","Por qué dormimos (Matthew Walker)"],
["SUE-05","Cronotipo","Hay personas de mañana y de noche por genética, y en la adolescencia el reloj se retrasa de forma natural.","Apunta a qué horas estás más despejado y pon ahí tu tarea más difícil.","I","M","foster","Diary of a CEO: Matthew Walker"],
["SUE-06","Mito: me acostumbro a dormir 5 horas","Casi nadie se adapta. Te acostumbras a sentirte peor y dejas de notarlo, pero rindes menos.","Prueba una semana durmiendo 8 horas y compara tu energía y tu humor.","I","X","walker","Por qué dormimos (Matthew Walker)"],
["MOV-01","El ejercicio como medicina para el ánimo","Moverte con regularidad reduce la ansiedad y el bajón, y mejora la memoria y la concentración.","Camina 30 minutos a paso rápido 3 días. Puntúa tu ánimo del 1 al 10 antes y después.","B","F","suzuki","Diary of a CEO: Peter Attia"],
["MOV-02","Los mínimos de la OMS","Hasta los 17 años, una media de 60 minutos de actividad al día. Adultos: 150-300 minutos a la semana más fuerza 2 días.","Suma los minutos que te moviste la semana pasada y compáralos con la cifra.","B","F","who","Outlive (Peter Attia)"],
["MOV-03","Entrenamiento de fuerza","La fuerza protege huesos, articulaciones y metabolismo, y se relaciona con vivir más y mejor.","Dos sesiones de 20 minutos: sentadillas, flexiones, zancadas y plancha.","B","F","who","Fitness revolucionario (Marcos Vázquez)"],
["MOV-04","Sedentarismo","Pasar muchas horas seguidas sentado es un riesgo aunque hagas deporte. Levantarte cada rato ayuda.","Pon una alarma cada 45 minutos para levantarte dos minutos.","I","M","sit","Outlive (Peter Attia)"],
["MOV-05","Constancia antes que intensidad","El ejercicio que funciona es el que mantienes. Tres sesiones moderadas durante años valen más que un mes a tope.","Elige una actividad que te guste y ponla en el calendario con día y hora.","I","M","brewer","Fitness revolucionario (Marcos Vázquez)"],
["MOV-06","Mito: sin dolor no hay resultado","Las agujetas no indican que el entreno sea bueno, y el dolor articular es señal de parar.","Termina cada sesión sintiendo que podrías haber hecho un poco más.","I","X","suzuki","Outlive (Peter Attia)"],
["ALI-01","Ultraprocesados","Bollería, snacks, refrescos y precocinados están diseñados para que comas más, y un consumo alto se asocia a peor salud física y mental.","Cambia un ultraprocesado al día por comida real: fruta, frutos secos, yogur natural.","B","F","b_dieta","Diary of a CEO: Tim Spector"],
["ALI-02","El plato equilibrado","Mitad verdura y fruta, un cuarto proteína, un cuarto cereal integral o patata, y agua para beber.","Monta al menos una comida al día así durante 7 días.","B","F","b_dieta","Chef sapiens (Marcos Vázquez y Elizabeth Ochoa)"],
["ALI-03","Hambre física y hambre emocional","La física llega poco a poco y cualquier comida vale. La emocional llega de golpe, pide algo concreto y viene con aburrimiento, estrés o tristeza.","Antes de picar, pregúntate: ¿me comería ahora una manzana? Si no, apunta qué sientes.","B","M","brewer","Mi dieta cojea (Aitor Sánchez)"],
["ALI-04","Proteína y fibra","La proteína te sacia y cuida el músculo; la fibra (legumbres, verdura, fruta) regula el apetito y la flora intestinal.","Come legumbre tres veces esta semana.","I","F","b_dieta","Diary of a CEO: Tim Spector"],
["ALI-05","Mito: los zumos detox limpian el cuerpo","Tu hígado y tus riñones ya hacen ese trabajo. Los productos detox no aportan nada.","Lee la etiqueta de un producto milagro y busca qué estudio lo respalda.","I","X","b_dieta","Diary of a CEO: Tim Spector"],
["EMO-01","Ponerle nombre a lo que sientes","Distinguir frustración, decepción, vergüenza, celos o soledad en vez de decir «estoy mal». Nombrarlo ya ayuda a regularlo.","Tres veces al día, escribe la emoción con la palabra más exacta que encuentres.","B","F","barrett","Por qué nadie me lo dijo antes (Julie Smith)"],
["EMO-02","Las emociones informan, no ordenan","Sentir rabia no te obliga a gritar. La emoción avisa de algo y tú decides qué haces.","Cuando notes una emoción fuerte, espera 90 segundos y respira antes de responder.","B","F","david","Inteligencia emocional (Daniel Goleman)"],
["EMO-03","Evitación","Evitar lo que te da miedo alivia en el momento y hace que el miedo crezca después.","Haz algo pequeño que evitas. Anota cuánta ansiedad esperabas y cuánta sentiste.","B","F","david","La trampa de la felicidad (Russ Harris)"],
["EMO-04","Autocompasión","Tratarte como tratarías a un buen amigo cuando fallas. Motiva más que machacarte.","Cuando te equivoques, escribe lo que le dirías a un amigo y léetelo.","I","M","neff","Sé amable contigo mismo (Kristin Neff)"],
["EMO-05","Rumiación","Dar vueltas a lo mismo sin llegar a nada. Parece pensar, pero mantiene el malestar.","Pregúntate: ¿estoy resolviendo algo? Si no, cambia de actividad 2 minutos.","I","F","winch","Por qué nadie me lo dijo antes (Julie Smith)"],
["EMO-06","Vulnerabilidad","Mostrar lo que sientes a personas de confianza es la base de las relaciones cercanas.","Cuéntale a alguien de confianza algo que te preocupa de verdad.","I","M","brown","El poder de ser vulnerable (Brené Brown)"],
["EMO-07","Mito: hay que pensar en positivo siempre","Obligarte a estar bien aumenta el malestar. Aceptar las emociones difíciles ayuda a que pasen.","Cuando estés mal, dite «tiene sentido que me sienta así».","I","X","david","La trampa de la felicidad (Russ Harris)"],
["PEN-01","Distorsiones cognitivas","Errores de pensamiento muy comunes: catastrofizar, leer la mente, todo o nada, «siempre me pasa lo mismo».","Apunta un pensamiento negativo al día y busca pruebas a favor y en contra.","B","F","b_burns","El arte de no amargarse la vida (Rafael Santandreu)"],
["PEN-02","Un pensamiento no es un hecho","Que pienses «soy un desastre» no lo hace verdad. Puedes observar tus pensamientos sin creértelos.","Antepón «estoy teniendo el pensamiento de que...» a tus pensamientos duros.","B","F","b_harris","Diary of a CEO: Julie Smith"],
["PEN-03","Mentalidad de crecimiento","Las habilidades se desarrollan con práctica. Ayuda sobre todo si crees que «no vales para algo».","Añade «todavía» a tus frases: «no sé hacerlo todavía».","I","M","dweck","Mindset (Carol Dweck)"],
["PEN-04","Lo que depende de ti","Separar lo que controlas (tus actos, tu esfuerzo) de lo que no (lo que piensan otros, el pasado). Es la idea central del estoicismo.","Haz dos columnas con lo que te preocupa: depende de mí / no depende de mí.","B","M","b_covey","Invicto (Marcos Vázquez)"],
["PEN-05","Sesgo de negatividad","Tu cerebro da más peso a lo malo: una crítica pesa más que diez elogios.","Antes de dormir, escribe tres cosas concretas que salieron bien hoy.","I","F","achor","Pensar rápido, pensar despacio (Daniel Kahneman)"],
["HAB-01","Diseña tu entorno","Quien parece tener mucha fuerza de voluntad en realidad se expone menos a tentaciones.","Deja a la vista lo que quieres hacer y esconde lo que quieres evitar (móvil en otra habitación).","B","F","brewer","Hábitos atómicos (James Clear)"],
["HAB-02","El bucle del hábito","Todo hábito tiene una señal, una rutina y una recompensa. Para cambiarlo, detecta la señal.","Elige un mal hábito y apunta qué lo dispara cada vez: lugar, hora, emoción o persona.","B","F","brewer","Diary of a CEO: James Clear"],
["HAB-03","Empezar en pequeño","Reduce el hábito a dos minutos (ponerte las zapatillas, leer una página). Primero la costumbre, luego más.","Haz un hábito en su versión de dos minutos todos los días.","B","M","b_clear","Diary of a CEO: James Clear"],
["HAB-04","La procrastinación es emocional","No es pereza: aplazas para evitar una emoción desagradable (aburrimiento, miedo a hacerlo mal).","Antes de la tarea que aplazas, nombra la emoción que te provoca y trabaja solo 10 minutos.","B","F","urban","¡Tráguese ese sapo! (Brian Tracy)"],
["HAB-05","Si pasa X, haré Y","Decidir de antemano cuándo y dónde harás algo duplica la probabilidad de hacerlo.","Escribe un plan «si..., entonces...» para tu hábito principal.","I","F","b_clear","Los 7 hábitos de la gente altamente efectiva (Stephen Covey)"],
["HAB-06","Mito: un hábito se crea en 21 días","Un estudio midió una media de 66 días, con mucha variación según la persona.","Plantéate tu hábito para 2-3 meses, no para 21 días.","I","X","b_clear","Diary of a CEO: James Clear"],
["REL-01","Las relaciones son salud","El estudio más largo sobre felicidad (Harvard, más de 80 años) dice que la calidad de tus relaciones predice tu salud mejor que el dinero.","Escribe o queda con alguien con quien hace tiempo que no hablas.","B","F","waldinger","Una buena vida (Waldinger y Schulz)"],
["REL-02","Comunicación asertiva","Decir lo que piensas y necesitas sin atacar ni callarte. Fórmula: hecho + cómo me siento + qué necesito.","Prepara una petición pendiente con la fórmula y dila esta semana.","B","M","headlee","Comunicación no violenta (Marshall Rosenberg)"],
["REL-03","Poner límites","Decir que no sin justificarte mil veces. Un límite habla de ti, no de controlar al otro.","Di un no pequeño esta semana sin dar más de una razón.","B","M","brown","Comunicación no violenta (Marshall Rosenberg)"],
["REL-04","Estilos de apego","Patrones de cómo buscas cercanía: seguro, ansioso o evitativo. Se aprenden y pueden cambiar.","Lee los tres estilos y anota con cuál te identificas y cuándo.","I","M","waldinger","Maneras de amar (Levine y Heller)"],
["REL-05","Escuchar de verdad","Escuchar para entender, no para responder. Preguntar más, interrumpir menos.","En una conversación, haz dos preguntas de seguimiento antes de hablar de ti.","I","M","headlee","Diary of a CEO: Esther Perel"],
["REL-06","Reparar tras un conflicto","Las amistades y parejas que duran no son las que no discuten, sino las que saben arreglarlo.","Tras una discusión, da el primer paso: «lo de antes no salió bien, ¿lo hablamos?».","I","M","headlee","Siete reglas de oro para vivir en pareja (John Gottman)"],
["REL-07","Relaciones sanas y control","Revisar el móvil del otro, pedir la ubicación todo el rato o controlar con quién hablas no es amor: es control.","Repasa tu relación y mira si aparece alguna de estas conductas. Si te preocupa, habla con alguien.","I","F","ayuda","Siete reglas de oro para vivir en pareja (John Gottman)"],
["ATE-01","Diseño persuasivo","Scroll infinito, notificaciones y rachas están diseñados para quedarse con tu tiempo. No es solo falta de voluntad.","Desactiva las notificaciones que no vengan de personas y mira tu tiempo de pantalla el domingo.","B","M","harris","La generación ansiosa (Jonathan Haidt)"],
["ATE-02","La multitarea no existe","Tu cerebro no estudia y mira el móvil a la vez: alterna, y cada cambio cuesta tiempo y errores.","Bloques de 25 minutos con el móvil en otra habitación y 5 de descanso.","B","F","jha","Céntrate (Cal Newport)"],
["ATE-03","Entrenar la atención","La atención se entrena: unos minutos al día atendiendo a la respiración mejoran la concentración.","5 minutos al día atendiendo a tu respiración; cuando te distraigas, vuelve sin juzgarte.","I","M","jha","Saludable mente (Marcos Vázquez)"],
["ATE-04","Comparación social en redes","Comparas tu día normal con los mejores momentos editados de otros.","Deja de seguir 10 cuentas que te hacen sentir peor.","B","M","harris","Diary of a CEO: Jonathan Haidt"],
["ATE-05","Trabajo profundo","Bloques largos de concentración para lo que más importa.","Reserva dos bloques de 60 minutos sin móvil para tu tarea más importante.","I","M","jha","Céntrate (Cal Newport)"],
["ATE-06","Mito: el detox de dopamina","La dopamina no se vacía ni se reinicia. Lo útil es reducir estímulos fáciles, no la explicación química.","Cambia una sola cosa del entorno: el móvil fuera del dormitorio.","I","X","harris","Céntrate (Cal Newport)"],
["EST-01","Estrés agudo y estrés crónico","El estrés puntual te prepara. El problema es el estrés constante sin descanso.","Identifica tus 3 fuentes de estrés y marca cuál es puntual y cuál permanente.","B","F","mcg","Por qué nadie me lo dijo antes (Julie Smith)"],
["EST-02","Cómo interpretas los nervios","Ver el corazón acelerado como preparación y no como amenaza mejora el rendimiento.","Antes de un examen, dite «mi cuerpo se está preparando».","I","M","mcg","Diary of a CEO: Andrew Huberman"],
["EST-03","Respiración lenta","Soltar el aire despacio calma el cuerpo. Es inmediato y gratis.","5 minutos al día: inspira 4 segundos y suelta el aire en 6-8.","B","M","mcg","Diary of a CEO: Andrew Huberman"],
["EST-04","Decidir antes del estrés","Con estrés pensamos peor, así que conviene prever qué puede fallar y decidirlo antes.","Antes de algo importante, escribe tres cosas que podrían fallar y qué harías.","I","M","levitin","Pensar rápido, pensar despacio (Daniel Kahneman)"],
["EST-05","Recuperación real","El scroll no siempre descansa. Recuperan el ejercicio, la naturaleza, la gente y el sueño.","Programa dos ratos de ocio sin pantallas esta semana.","B","M","winch","Por qué nadie me lo dijo antes (Julie Smith)"],
["EST-06","Pedir apoyo","Ser fuerte no es aguantar solo. Quien mejor supera las crisis es quien pide ayuda.","Cuéntale a alguien de confianza qué te está costando ahora.","B","F","waldinger","Una buena vida (Waldinger y Schulz)"],
["VAL-01","Valores y metas","Los valores son tu dirección (ser leal, aprender, cuidar); las metas, destinos concretos.","Elige tus 5 valores principales y una acción de esta semana para cada uno.","B","M","smith","La trampa de la felicidad (Russ Harris)"],
["VAL-02","Sentido antes que felicidad","El sentido se construye con pertenencia, propósito y la historia que te cuentas de tu vida.","Escribe qué actividad de tu semana te hizo sentir útil o conectado.","B","M","smith","El hombre en busca de sentido (Viktor Frankl)"],
["VAL-03","Liderazgo sin cargo","Cualquiera puede tomar la iniciativa y mejorar lo que le rodea, sin necesitar un puesto.","Mejora algo en clase, en el trabajo o en casa sin que te lo pidan.","I","D","b_sharma","Los 7 hábitos (Stephen Covey)"],
["VAL-04","Lo urgente y lo importante","Lo urgente grita; lo importante (salud, gente, aprender) casi nunca. Si no lo planificas, desaparece.","Al empezar la semana, elige 3 cosas importantes y ponles hora.","I","M","urban","Los 7 hábitos (Stephen Covey)"],
["VAL-05","Ayudar a otros","Aportar algo a los demás se asocia a más bienestar y sentido.","Haz algo útil por alguien sin que te lo pida.","B","M","achor","Diary of a CEO: Simon Sinek"],
["VAL-06","Mito: encuentra tu pasión","La pasión suele aparecer después de hacerte bueno en algo, no antes.","Elige algo que te dé curiosidad y practícalo 4 semanas antes de juzgarlo.","I","X","smith","El hombre en busca de sentido (Viktor Frankl)"],

["PEN-09","Apunta tus avances","Tu cerebro recuerda mejor lo que falla que lo que sale bien. Si no apuntas tus avances, sentirás que no avanzas aunque lo estés haciendo.","Cada noche, apunta una cosa concreta que hayas hecho bien o mejor que antes, por pequeña que sea.","I","M","achor","La auténtica felicidad (Martin Seligman)"],
["CRI-09","Decisiones de ida y vuelta","Algunas decisiones se pueden deshacer (probar un deporte, un curso corto). Otras, no tanto (un tatuaje, un préstamo, dejar los estudios). Las primeras puedes tomarlas rápido. Las segundas merecen tiempo, información y alguien con quien hablarlo, sobre todo si estás enfadado o eufórico.","Esta semana, ante cada decisión, pregúntate: ¿tiene vuelta atrás? Si no la tiene, espera un día y coméntala con alguien antes de decidir.","B","M","galef","Pensar rápido, pensar despacio (Daniel Kahneman)"],
["CRI-10","¿Qué me haría cambiar de opinión?","Si no hay nada que pudiera hacerte cambiar de opinión, ya no estás pensando: estás defendiendo a un equipo. Hacerte esta pregunta te hace más libre y más difícil de manipular.","Elige una opinión fuerte que tengas y escribe qué dato o argumento te haría cambiarla. Luego busca si existe.","I","M","galef","Piénsalo otra vez (Adam Grant)"],
["REL-08","Consentimiento y límites","Consentir es decir que sí con libertad, sabiendo a qué, y poder cambiar de idea en cualquier momento. Vale para todo: una foto, un mensaje, un abrazo o una relación. Si hay presión, miedo o alcohol de por medio, no es un sí libre. Y un «no» no necesita explicaciones.","Esta semana, pregunta antes de subir una foto en la que salga otra persona. Y practica decir un no sin dar explicaciones.","B","M","ayuda","Fundación ANAR y 016 (sección Ayuda)"],
["EST-08","Ocio que eliges","Descansar no es solo no hacer nada o pasar horas con el móvil. El ocio que eliges (tocar música, dibujar, jugar con amigos, cocinar) recarga más que el que te arrastra. Y no tiene que servir para nada: ni notas, ni dinero, ni likes.","Reserva 30 minutos dos veces esta semana para algo que hagas solo porque te gusta, sin móvil y sin hacerlo «bien».","B","M","robinson","El Elemento (Ken Robinson)"]

["CRI-11","Sesgo de confirmación","Es un sesgo: tendemos a buscar y creer lo que nos da la razón, e ignorar lo que nos la quita. Los algoritmos lo empeoran, porque te enseñan más de lo que ya piensas.","Elige un tema en el que tengas una opinión fuerte y busca a propósito el mejor argumento de quien piensa lo contrario.","I","F","galef","Pensar rápido, pensar despacio (Daniel Kahneman)"],
["CRI-12","Sesgo del superviviente: solo ves a los que ganan","Es un sesgo: ves al influencer que se hizo rico dejando los estudios, pero no a los miles que lo intentaron y no lo consiguieron, porque esos no salen en redes. Hace que algo parezca más fácil de lo que es.","Cuando veas un éxito espectacular, pregúntate: ¿cuántos lo intentaron y no salen?","I","M","galef","Factfulness (Hans Rosling)"],
["CRI-13","Coste hundido: seguir porque ya has invertido","Es un sesgo: seguir con algo que no te gusta solo porque ya le has dedicado tiempo o dinero (una serie mala, un plan que no funciona). Lo gastado no vuelve. La pregunta útil es: desde hoy, ¿me compensa?","Piensa en algo que mantienes solo porque «ya he invertido mucho» y pregúntate: si empezara hoy, ¿lo elegiría?","I","M","galef","Pensar rápido, pensar despacio (Daniel Kahneman)"],
["PEN-10","Efecto foco: no te miran tanto como crees","Es un sesgo: creemos que los demás se fijan en nuestros fallos mucho más de lo que lo hacen. En un estudio, quien llevaba una camiseta ridícula creía que la había visto la mitad de la clase; en realidad, se fijó más o menos una de cada cuatro personas. Cada uno está pendiente de sí mismo.","Esta semana haz una cosa pequeña que te dé vergüenza (preguntar en clase, llevar algo distinto) y fíjate en cuánta gente lo comenta de verdad.","B","M","brown","Estudio de Thomas Gilovich sobre el efecto foco (2000)"],
["REL-09","Error de atribución: yo tengo excusas, los demás no","Es un sesgo: cuando tú llegas tarde es por el autobús; cuando llega tarde otro, es un irresponsable. Explicamos lo nuestro por las circunstancias y lo de los demás por su forma de ser. Crea muchos conflictos.","La próxima vez que alguien te moleste, piensa una circunstancia que podría explicarlo antes de juzgarle.","I","M","headlee","Comunicación no violenta (Marshall Rosenberg)"],
["DIN-25","Sesgo del presente: lo quiero ya","Es un sesgo: tu cerebro valora mucho más algo ahora que algo mejor más adelante. Por eso cuesta ahorrar, estudiar con tiempo o soltar el móvil. No es falta de voluntad: nos pasa a todos, y se vence poniéndote una espera.","Cuando quieras algo ya, ponte una espera: 24 horas para una compra y 10 minutos para el móvil.","B","F","benartzi","La psicología del dinero (Morgan Housel)"],
["DIN-26","Falacia del jugador: «ya me toca ganar»","Es un sesgo: creer que después de varias pérdidas ya toca ganar. En el azar cada jugada es independiente: la ruleta, las tragaperras o las cajas sorpresa de los videojuegos no recuerdan lo que pasó antes. Por eso mucha gente sigue apostando para recuperar.","Si alguna vez piensas «ya me toca», recuerda que el azar no tiene memoria y para.","B","F","jugar","Jugar Bien (Ministerio de Consumo)"]

"SUE-01":["Marc pensaba que dormía 8 horas. Al apuntarlo vio que entre semana eran 6 y media, y entendió por qué estaba tan irritable por las tardes.","Si apago la luz, entonces apunto la hora en Brújula o en las notas del móvil.","Apunta solo la hora de levantarte."],
"SUE-02":["Lucía se levantaba a las 7:15 entre semana y a las 12 el finde. Los lunes era un zombi. Fijó las 9 los sábados y domingos, y el lunes le costó mucho menos.","Si suena mi alarma, entonces me levanto a la primera y abro la persiana.","Levántate a tu hora aunque luego descanses en el sofá."],
"SUE-03":["Àlex dejaba el móvil en el pasillo a las 23:00. Las dos primeras noches se aburrió; la tercera ya se dormía antes y se despertaba con menos sueño.","Si son las 22:30, entonces dejo el móvil cargando fuera de mi cuarto.","Deja el móvil fuera solo los últimos 10 minutos."],
"SUE-04":["Iker tomaba una bebida energética a las 18:00 para estudiar. Al cambiarla por agua con limón, tardaba menos en dormirse.","Si son más de las 14:00 y me apetece algo, entonces tomo agua, infusión sin teína o leche.","Si tomas cafeína por la tarde, que sea solo la mitad."],
"SUE-05":["Sara descubrió que a las 10 de la mañana rendía el doble que por la noche. Movió los ejercicios de mates a la mañana del sábado.","Si mañana tengo algo difícil, entonces lo hago en mi mejor hora del día.","Apunta solo cómo de despejado estás ahora, del 1 al 10."],
"MOV-01":["Nerea estaba de bajón con los exámenes. Volver andando del instituto a paso rápido le subía el ánimo de un 4 a un 7.","Si salgo de clase, entonces vuelvo andando rápido en lugar de en bus.","Camina rápido 5 minutos, aunque sea por casa o por el pasillo."],
"MOV-02":["Pol creía que se movía bastante. Al sumar, salían 150 minutos a la semana, menos de la mitad de lo recomendado para su edad.","Si es domingo por la noche, entonces sumo los minutos que me he movido esta semana.","Apunta solo los minutos de hoy."],
"MOV-03":["Ainhoa no tenía gimnasio. Con 20 minutos en su cuarto (sentadillas, flexiones apoyando las rodillas y plancha) a las tres semanas subía las escaleras sin ahogarse.","Si es martes o jueves al volver a casa, entonces hago mis 20 minutos de fuerza antes de merendar.","Haz 10 sentadillas y 20 segundos de plancha."],
"MOV-04":["Hugo pasaba 3 horas seguidas jugando. Con una alarma cada 45 minutos se levantaba a por agua, y ya no acababa con dolor de espalda.","Si suena la alarma de los 45 minutos, entonces me levanto y doy una vuelta.","Levántate y estira los brazos 30 segundos."],
"MOV-05":["Laia se apuntaba al gimnasio cada septiembre y lo dejaba en octubre. Este año eligió baile, que le encanta, los martes y jueves a las 18:00.","Si es martes o jueves a las 17:45, entonces cojo la bolsa y salgo hacia la actividad.","Si un día no vas, haz 5 minutos de esa actividad en casa."],
"ALI-01":["Joel desayunaba bollería cada día. La cambió por tostada con aceite o fruta, y a media mañana ya no tenía ese bajón.","Si me apetece algo de la máquina del instituto, entonces me como la fruta o los frutos secos que llevo en la mochila.","Cambia un solo producto envasado por una pieza de fruta."],
"ALI-02":["Martina casi siempre comía un plato de pasta y nada más. Empezó a acompañarlo con medio plato de ensalada o verdura y un huevo o una lata de atún.","Si me sirvo la comida, entonces lleno primero medio plato de verdura o ensalada.","Añade una pieza de verdura o fruta a una comida."],
"ALI-03":["Dani se daba cuenta de que picaba cuando se aburría estudiando. Al preguntarse «¿me comería una manzana?», casi siempre la respuesta era no: era aburrimiento.","Si me apetece picar sin hora de comer, entonces me pregunto si me comería una manzana.","Antes de picar, bebe un vaso de agua y espera 2 minutos."],
"ALI-04":["Clara comía legumbre solo cuando la cocinaban en casa. Aprendió a hacer hummus y lentejas de bote con verdura en 10 minutos.","Si es lunes, miércoles o viernes, entonces una de mis comidas lleva legumbre.","Añade un puñado de garbanzos de bote a una ensalada."],
"EMO-01":["Biel siempre decía «estoy rayado». Al buscar la palabra exacta vio que era «decepcionado con mi amigo», y pudo hablar con él.","Si es la hora de la comida, la merienda o la cena, entonces escribo la emoción que tengo con una palabra exacta.","Escribe una sola palabra para cómo estás ahora."],
"EMO-02":["Ona solía contestar a su madre en caliente. Ahora, cuando nota la rabia, cuenta hasta 90 respirando y luego habla. Discuten menos.","Si noto que me enciendo, entonces respiro hondo 5 veces antes de contestar.","Respira hondo 3 veces antes de responder."],
"EMO-03":["Gerard evitaba llamar por teléfono. Empezó llamando a la panadería para preguntar el horario: esperaba 8 de ansiedad y fue un 3.","Si tengo algo que me da corte, entonces lo hago en los primeros 10 minutos de la tarde.","Haz la versión más pequeña: escribe en vez de llamar, pero hazlo."],
"EMO-04":["Paula suspendió física y se repetía «soy idiota». Al escribir lo que le diría a su mejor amiga («es un examen, no eres tú»), se calmó y se puso a estudiar.","Si me equivoco y me insulto por dentro, entonces me pregunto qué le diría a un amigo.","Dite una frase amable, como «lo estoy intentando»."],
"EMO-05":["Arnau repasaba en la cama la discusión del día. Ahora se pregunta «¿estoy resolviendo algo?» y, si no, se levanta y bebe agua o lee algo.","Si me doy cuenta de que le doy vueltas a lo mismo, entonces me levanto y cambio de actividad.","Nombra en voz baja lo que piensas: «estoy dándole vueltas a…»."],
"EMO-06":["Julia siempre decía «todo bien». Un día le contó a su prima que estaba agobiada con su grupo de amigas y se sintió mucho más ligera.","Si alguien de confianza me pregunta qué tal, entonces cuento una cosa real.","Escribe a alguien de confianza: «hoy no ha sido un buen día»."],
"PEN-01":["Aleix pensaba «todos se van a reír de mí» antes de exponer. Buscó pruebas: en las exposiciones de sus compañeros, nadie se había reído de nadie. Salió a exponer más tranquilo.","Si pienso algo muy negativo, entonces lo escribo y pongo una prueba a favor y una en contra.","Escribe solo el pensamiento negativo. Verlo escrito ya ayuda."],
"PEN-02":["Carla pensaba «soy un desastre». Al decirse «estoy teniendo el pensamiento de que soy un desastre», le pareció una idea, no una verdad.","Si me viene un pensamiento duro sobre mí, entonces le añado «estoy teniendo el pensamiento de que...».","Dite: «es solo un pensamiento»."],
"PEN-04":["Eric estaba agobiado por la nota de un examen ya hecho. En la columna «depende de mí» puso «preparar el siguiente» y se puso con ello.","Si algo me preocupa, entonces lo apunto en una de las dos columnas.","Pregúntate solo: ¿esto depende de mí?"],
"PEN-03":["Inés decía «no se me dan bien las mates». Cambió a «todavía no se me dan bien» y empezó a pedir ayuda en vez de rendirse.","Si digo «no sé» o «no puedo», entonces añado «todavía».","Corrige una sola frase al día con «todavía»."],
"PEN-05":["Xavi siempre recordaba lo que salía mal. Al escribir 3 cosas buenas cada noche (un buen bocata, un gol, una risa) vio que sus días no eran tan malos.","Si me meto en la cama, entonces escribo 3 cosas concretas que salieron bien.","Escribe una sola cosa que salió bien."],
"PEN-07":["Mar se enfadó porque su amiga no contestó. El hecho: no contestó en 2 horas. Su pensamiento: «pasa de mí». Luego supo que estaba sin batería.","Si algo me enfada, entonces separo el hecho de lo que estoy pensando.","Escribe solo el hecho, sin opiniones."],
"HAB-01":["Roger no conseguía estudiar con el móvil al lado. Lo dejaba en la cocina y el libro abierto en la mesa al llegar. Ya no dependía de la fuerza de voluntad.","Si me siento a estudiar, entonces el móvil se queda en otra habitación.","Aleja el móvil un metro mientras haces una tarea."],
"HAB-02":["Elena se dio cuenta de que abría TikTok siempre al terminar de comer. Esa era la señal. Ahora sale 5 minutos al balcón.","Si hago lo que quiero dejar, entonces apunto dónde estaba, qué hora era y qué sentía.","Apunta solo la hora."],
"HAB-03":["Mohamed quería leer más. Empezó con una página al día antes de dormir. A las tres semanas leía 15 minutos sin esfuerzo.","Si termino de cenar, entonces hago mi hábito en su versión de dos minutos.","Hazlo 30 segundos. Lo que cuenta es no romper la cadena."],
"HAB-05":["Andrea escribió: «si llego a casa, entonces me cambio y salgo a correr». No tenía que decidir nada: el plan decidía por ella.","Si [momento concreto], entonces [acción concreta].","Escribe el plan, aunque hoy no lo cumplas."],
"REL-01":["Pau escribió a un amigo de primaria con el que había perdido el contacto. Quedaron el sábado y fue la mejor tarde del mes.","Si es viernes por la tarde, entonces escribo a alguien con quien hace tiempo que no hablo.","Manda un mensaje corto: «Me he acordado de ti. ¿Qué tal todo?»."],
"REL-02":["Abril no se atrevía a decirle a su compañera que no hacía su parte del trabajo. Le dijo: «El trabajo es el viernes, me agobia ir tarde. ¿Puedes acabar tu parte el miércoles?». Funcionó.","Si tengo algo pendiente que decir, entonces lo preparo con: hecho + cómo me siento + qué necesito.","Escribe la frase, aunque no la digas todavía."],
"REL-03":["Iván siempre prestaba los apuntes y luego no los recuperaba. Dijo «esta vez no, los necesito» sin dar más explicaciones, y no pasó nada.","Si me piden algo que no quiero hacer, entonces digo «esta vez no» y doy una sola razón.","Responde «déjame pensarlo» en lugar de un sí automático."],
"REL-04":["Noa se reconoció en el estilo ansioso: necesitaba que su pareja contestara rápido. Saberlo le ayudó a hablarlo en vez de agobiarse.","Si siento celos o necesidad de confirmación, entonces lo apunto y pienso qué estilo está hablando.","Lee la descripción de un solo estilo."],
"REL-05":["Guillem solía contar su historia en cuanto otro terminaba. Probó a hacer dos preguntas («¿y qué hiciste?», «¿cómo te sentiste?») y su amigo le contó mucho más.","Si alguien me cuenta algo, entonces hago dos preguntas antes de hablar de mí.","Haz una sola pregunta de seguimiento hoy."],
"REL-06":["Lara discutió con su hermano por la consola. Al día siguiente le dijo «lo de ayer no salió bien, ¿lo hablamos?» y se arreglaron en 5 minutos.","Si discuto con alguien que me importa, entonces doy el primer paso en menos de un día.","Manda un mensaje: «Siento cómo acabó lo de antes»."],
"ATE-01":["Nil tenía 80 notificaciones al día. Dejó activas solo las de personas y bajó de 6 a 4 horas de pantalla en una semana.","Si una app me manda una notificación que no es de una persona, entonces la desactivo.","Desactiva las notificaciones de una sola app."],
"ATE-02":["Èlia estudiaba 2 horas con el móvil al lado y rendía poco. Con bloques de 25 minutos sin móvil, en 1 hora hacía lo mismo.","Si me pongo a estudiar, entonces pongo un temporizador de 25 minutos y el móvil fuera de la habitación.","Haz un solo bloque de 10 minutos sin móvil."],
"ATE-04":["Mireia salía de Instagram sintiéndose fea. Dejó de seguir 10 cuentas de cuerpos perfectos y siguió cuentas de cosas que le gustan, como dibujo y viajes.","Si una cuenta me hace sentir peor, entonces dejo de seguirla en ese momento.","Deja de seguir una sola cuenta."],
"ATE-03":["Oriol no podía estar concentrado ni 5 minutos. Al principio se distraía cada 10 segundos; después de una semana, aguantaba un minuto entero.","Si me lavo los dientes por la noche, entonces después hago mis 5 minutos de respiración.","Haz 3 respiraciones atentas."],
"ATE-05":["Judit dejó el trabajo de investigación para el final. Reservó dos bloques de una hora sin móvil y lo avanzó más que en toda la semana anterior.","Si es sábado a las 10, entonces hago mi bloque de 60 minutos de la tarea más importante.","Haz 15 minutos sin interrupciones."],
"EST-01":["Adrià tenía tres fuentes de estrés: exámenes (puntual), el entrenamiento (puntual) y la tensión en casa (permanente). Entendió que esa última necesitaba hablarla con alguien.","Si me noto tenso, entonces apunto de dónde viene.","Nombra una sola fuente de estrés."],
"EST-03":["Natalia se ponía muy nerviosa antes de los exámenes. Cinco minutos de respiración lenta en el pasillo le bajaban el corazón.","Si me noto nervioso, entonces inspiro 4 segundos y suelto el aire en 6.","Haz 3 respiraciones lentas."],
"EST-05":["Jan pensaba que descansaba con el móvil, pero seguía cansado. Un rato jugando al fútbol con amigos le dejó más descansado que dos horas de scroll.","Si es miércoles o sábado por la tarde, entonces hago algo sin pantalla: deporte, salir, cocinar, tocar música.","Sal 10 minutos a la calle sin el móvil en la mano."],
"EST-02":["Valeria temblaba antes de exponer. Se dijo «mi cuerpo se está preparando» y usó esa energía para hablar con más fuerza.","Si noto nervios antes de algo importante, entonces me digo «mi cuerpo se está preparando».","Repite la frase una vez."],
"EST-04":["Antes del examen de conducir, Marcos escribió: «puedo bloquearme», «llegar tarde», «olvidar el DNI». Preparó cada cosa la noche antes y fue más tranquilo.","Si tengo algo importante mañana, entonces escribo 3 cosas que podrían fallar y qué haría.","Escribe una sola cosa que podría fallar."],
"EST-07":["Pere esperaba el autobús 20 minutos sin mirar el móvil. Al principio se agobiaba; al quinto día lo disfrutaba.","Si estoy esperando algo, entonces no saco el móvil durante 5 minutos.","Espera 1 minuto sin mirar el móvil."],
"VAL-01":["Emma eligió familia, aprender y amistad. Para «amistad» se propuso llamar a una amiga; para «aprender», ver un vídeo de algo que le interesaba.","Si es lunes, entonces elijo una acción para cada uno de mis valores.","Elige un solo valor y una acción pequeña."],
"VAL-02":["Max se dio cuenta de que lo mejor de su semana fue ayudar a su abuelo con el móvil, no las horas jugando.","Si es domingo, entonces escribo qué me hizo sentir útil o conectado esta semana.","Escribe una sola frase."],
"VAL-05":["Carlota ayudó a un compañero nuevo a encontrar las aulas. Le costó 5 minutos y se sintió bien todo el día.","Si veo a alguien que necesita algo pequeño, entonces lo ayudo sin esperar a que me lo pida.","Haz un favor de 1 minuto: abrir una puerta, prestar un boli."],
"VAL-03":["En el trabajo en grupo nadie organizaba nada. Bruno propuso un reparto y un día de entrega. No era el líder, pero el grupo funcionó.","Si veo algo que se podría mejorar, entonces propongo una solución concreta.","Haz una pequeña mejora: ordena, propón algo o pregunta."],
"VAL-04":["Ariadna vivía apagando fuegos. El lunes elegía tres cosas importantes (estudiar biología, entrenar, llamar a su abuela) y les ponía hora.","Si es lunes por la mañana, entonces elijo mis 3 cosas importantes y les pongo hora.","Elige una sola cosa importante para hoy."],
"VAL-09":["Leo se pasaba horas en el móvil por la noche. Descubrió que lo hacía para sentirse conectado, y empezó a llamar a un amigo en vez de hacer scroll.","Si hago algo que no me conviene, entonces me pregunto qué necesito de verdad.","Pregúntate solo: ¿qué necesito ahora?"],
"DIN-24":["Marta compraba un refresco y una bolsa de patatas en la máquina casi cada día: unos 2,50 euros. Al sumarlo, eran unos 50 euros al mes. Decidió quedarse solo con el refresco del viernes, que es el que de verdad disfruta, y guardar el resto.","Si voy a comprar algo pequeño, entonces me pregunto si lo disfruto de verdad o lo compro por costumbre.","Apunta solo los gastos pequeños de hoy."],
"DIN-19":["Hugo quería ser fotógrafo. Su tío le dijo: «si ahorras un poco cada mes, podrás comprarte tu primera cámara sin pedírsela a nadie». Lo entendió: el dinero le daba la libertad de empezar.","Si recibo dinero, entonces pienso qué libertad me gustaría tener y aparto una parte para ella.","Escribe una sola cosa que te gustaría poder elegir gracias al dinero."],
"DIN-20":["Sara quería una sudadera de 60 euros. Su hermana trabajaba de camarera los fines de semana a 9 euros la hora: casi 7 horas de trabajo. Sara se compró otra de 25 y guardó el resto.","Si algo cuesta más de 20 euros, entonces calculo cuántas horas de trabajo serían.","Calcula las horas de una sola compra."],
"DIN-21":["Nico vio en TikTok unas zapatillas «edición limitada, solo hoy». Esperó 48 horas y se le pasaron las ganas. Se ahorró 140 euros.","Si quiero comprar algo que no necesito, entonces lo apunto y espero 48 horas.","Pregúntate: ¿lo necesito o me apetece ahora?"],
"DIN-22":["Lucía preguntó en casa cuánto costaba la luz al mes. Le sorprendió tanto que empezó a apagar las luces sin que se lo dijeran.","Si estamos cenando y hay buen momento, entonces pregunto cuánto cuesta una cosa de casa.","Busca cuánto cuesta al mes tu tarifa del móvil."],
"DIN-23":["Adri se compraba algo por internet cada vez que tenía un mal día. Al darse cuenta, cambió las compras por salir a correr. Se sentía mejor y gastaba menos.","Si me entran ganas de comprar algo estando mal, entonces espero un día y lo vuelvo a pensar.","Apunta cómo te sentías antes de tu última compra."],
"DIN-01":["Gina recibía 20 euros de paga a la semana. Apartaba 2 nada más cobrar en una hucha. En un año tenía más de 100 sin notarlo.","Si recibo dinero, entonces aparto el 10 % antes de gastar nada.","Aparta 1 euro, aunque sea poco."],
"DIN-02":["Toni jugó con el simulador: 50 euros al mes desde los 18 años daban unos 113.000 euros a los 65; empezando a los 28, unos 64.000.","Si recibo dinero este mes, entonces pruebo el simulador con la cantidad que podría ahorrar.","Abre el simulador y mueve un control."],
"DIN-03":["Enzo creía que gastaba poco en sobres del FIFA. Al sumar los tres meses, salían 140 euros.","Si me apetece comprar un sobre o apostar, entonces espero 24 horas y lo apunto.","Revisa solo el último mes de compras en el juego."],
"DIN-05":["Cristina no sabía dónde se le iba el dinero. Al apuntarlo, vio que eran cafés y snacks: 30 euros al mes.","Si pago algo, entonces lo apunto en las notas del móvil en ese momento.","Apunta solo el gasto más grande del día."],
"DIN-06":["Aitana quería unas zapatillas de 120 euros. Esperó 48 horas y se dio cuenta de que era por aparentar. No las compró.","Si quiero comprar algo que no necesito, entonces espero 48 horas.","Pon el producto en una lista de «quizás» en vez de comprarlo."],
"DIN-08":["Marta guardaba 5 euros al mes solo para imprevistos. Cuando se le rompió la pantalla del móvil, no tuvo que pedir dinero.","Si recibo dinero, entonces aparto una cantidad fija para imprevistos.","Aparta 1 euro para imprevistos."],
"EDU-01":["Pablo releía los apuntes de historia tres veces y se quedaba en blanco. Probó a cerrar el libro y escribir todo lo que recordaba: a la primera, solo la mitad. Al repasar justo eso, sacó un 7.","Si termino de estudiar un tema, entonces cierro el libro y escribo lo que recuerdo durante 5 minutos.","Di en voz alta 3 cosas que recuerdes del tema."],
"EDU-02":["Laura estudiaba la noche antes y lo olvidaba en una semana. Repartió el estudio en lunes, miércoles, viernes y domingo, 30 minutos cada día, y lo recordaba en el examen final.","Si hay un examen en el calendario, entonces apunto 4 sesiones cortas en días distintos antes.","Estudia 10 minutos hoy de ese examen."],
"EDU-03":["Hugo subrayaba todo con fosforito. Cambió a hacerse 10 preguntas sobre el tema y descubrió lo que de verdad no sabía.","Si me pongo a repasar, entonces me hago preguntas en vez de releer.","Hazte 3 preguntas sobre el tema."],
"EDU-04":["Rosa explicó la fotosíntesis a su hermano pequeño. Se atascó en una parte y así supo exactamente qué repasar.","Si termino un tema, entonces se lo explico a alguien en 3 minutos.","Explícatelo a ti mismo en voz alta en 1 minuto."],
"EDU-05":["Andreu practicaba solo los ejercicios que ya le salían. Dedicó 20 minutos a los de probabilidad, que odiaba, y mejoró en el siguiente examen.","Si me siento a estudiar, entonces empiezo con 20 minutos de lo que peor llevo.","Haz un solo ejercicio de lo que peor llevas."],
"CRI-01":["Laia vio un vídeo que decía que iban a prohibir algo en los institutos. Lo buscó en un medio serio y en Maldita: era falso. No lo compartió.","Si algo me indigna mucho, entonces lo busco en dos fuentes antes de compartirlo.","Antes de compartir, espera 1 minuto y pregúntate quién lo dice."],
"CRI-02":["Marc solo veía vídeos que le daban la razón sobre un tema. Siguió una fuente seria que pensaba distinto y descubrió argumentos que no conocía.","Si abro una red social, entonces miro también una fuente que piensa distinto.","Lee un solo titular de una fuente que piense distinto."],
"CRI-04":["Sofía discutía siempre con su tío sobre política. Esta vez resumió lo que él pensaba hasta que le dijo «sí, es eso». La conversación fue mucho mejor.","Si hablo con alguien que piensa distinto, entonces resumo su postura antes de dar la mía.","Pregunta: «¿Por qué piensas eso?», y escucha sin interrumpir."],
"CRI-03":["Eric empezó a ver vídeos que culpaban a un grupo de todos sus problemas. Se preguntó quién ganaba con que él sintiera ese odio, y dejó de verlos.","Si un contenido me hace odiar a un grupo entero, entonces me pregunto quién gana con ello.","Deja de ver un vídeo que te hace odiar a alguien."],
"CRI-05":["Nora pensaba que el mundo iba cada vez peor. Al buscarlo, vio que la esperanza de vida mundial ha subido mucho en 50 años, aunque siguen existiendo problemas graves.","Si leo una noticia catastrófica, entonces busco un dato de largo plazo sobre ese tema.","Busca un solo dato positivo de largo plazo."],
"AUT-01":["Joan hizo el test y salió alto en apertura y bajo en extraversión. Entendió por qué le encantaba aprender cosas nuevas pero le agotaban las fiestas.","Si tengo 15 minutos libres esta semana, entonces hago el test Big Five.","Lee qué significan las 5 dimensiones."],
"AUT-02":["Marina descubrió que su fortaleza principal era la amabilidad. Esa semana la usó a propósito: ayudó a una compañera con un trabajo.","Si hago el test, entonces elijo una fortaleza y la uso a propósito un día.","Escribe una cosa en la que eres bueno."],
"AUT-03":["Rubén escribió tres días sobre la separación de sus padres. Nadie lo leyó, pero al tercer día lo tenía más ordenado en la cabeza.","Si es lunes, miércoles o viernes antes de dormir, entonces escribo 15 minutos sobre lo que me preocupa.","Escribe 3 frases."],
"AUT-04":["Gemma estaba segura de algo. Buscó el mejor argumento en contra y, aunque no cambió de opinión, la matizó.","Si estoy muy seguro de algo, entonces busco el mejor argumento en contra.","Pregúntate: ¿y si me equivoco en esto?"],
"AUT-05":["Martí explotaba cuando su madre le decía «siempre igual». Al apuntarlo, vio que era esa frase en concreto, y se lo pudo explicar.","Si reacciono más fuerte de lo que querría, entonces apunto qué pasó justo antes.","Apunta solo la palabra o la situación."],

"CRI-11":["Iker estaba convencido de que su equipo perdía por culpa del árbitro. Solo veía los vídeos que lo confirmaban. Cuando miró el partido entero, vio que también les habían pitado a favor.","Si algo me da la razón muy rápido, entonces busco una fuente que diga lo contrario antes de compartirlo.","Lee solo el titular de una noticia que opine distinto a ti."],
"CRI-12":["Nil vio a un youtuber que ganaba miles con criptomonedas y quiso meter sus ahorros. Su tía le preguntó cuántos habían perdido dinero. No salían en ningún vídeo, pero eran muchos más.","Si veo un éxito que parece fácil, entonces me pregunto cuántos lo intentaron y no lo consiguieron.","Piensa en un caso de éxito y en uno que no salió."],
"CRI-13":["Carla llevaba 8 temporadas de una serie que ya no le gustaba: «ya que he visto tanto…». Se preguntó si la empezaría hoy. No. La dejó y recuperó sus noches.","Si sigo con algo solo porque ya he invertido mucho, entonces me pregunto: si empezara hoy, ¿lo elegiría?","Hazte la pregunta una sola vez esta semana."],
"PEN-10":["Mía se manchó la camiseta antes de clase y pasó la mañana agobiada. Al final del día se lo contó a su amiga: ni se había dado cuenta.","Si me da vergüenza algo pequeño, entonces me recuerdo que cada uno está pendiente de sí mismo.","Pregunta una duda en clase esta semana."],
"REL-09":["Jan se enfadó porque un compañero no hizo su parte del trabajo: «es un vago». Luego supo que esa semana estaba cuidando a su abuela enferma.","Si alguien me molesta, entonces pienso una circunstancia que podría explicarlo antes de juzgarle.","Antes de quejarte de alguien, añade «a lo mejor…»."],
"DIN-25":["Oriol quería unas zapatillas de 120 € ya. Se puso una espera de 24 horas. Al día siguiente vio que tenía unas casi iguales y guardó el dinero para el viaje de fin de curso.","Si quiero comprar algo que no tenía pensado, entonces espero 24 horas antes de decidir.","Espera 10 minutos antes de abrir una app."],
"DIN-26":["Èric abrió 10 cajas sorpresa de un videojuego sin conseguir la skin que quería: «la siguiente seguro que sí». Gastó 30 € más y tampoco salió. Cada caja tenía la misma probabilidad que la primera.","Si pienso «ya me toca ganar», entonces paro: el azar no tiene memoria.","Cuenta cuánto has gastado este mes en cajas o apuestas."],
"AUT-04":["Ona se propuso pillar un sesgo al día. El lunes vio un anuncio de «solo hoy» (sesgo del presente). El miércoles se pilló pensando que todos la miraban por un grano (efecto foco). Le pareció un juego y empezó a decidir con más calma.","Si me noto muy seguro de algo, entonces me pregunto qué sesgo podría estar engañándome.","Nombra un sesgo que hayas visto hoy."],
"CRI-06":["En clase siempre hacían los trabajos los mismos grupos. Aitana invitó a Youssef, que acababa de llegar y se quedaba solo. Resultó que se le daba genial el diseño y su presentación fue la mejor.","Si veo a alguien solo en el recreo o sin grupo, entonces le invito a unirse.","Saluda por su nombre a alguien con quien no sueles hablar."],
"CRI-07":["Pol y su padre discutían en cada comida. Pol probó a empezar con «en esto tienes razón». La conversación bajó de tono y, por primera vez, su padre también le dio la razón en algo.","Si voy a llevar la contraria, entonces antes digo algo en lo que el otro tiene razón.","Escucha hasta el final sin interrumpir una vez."],
"DIN-04":["Una consola costaba 500 € al contado o «solo 25 € al mes». Leire hizo la cuenta: 24 meses por 25 €, más comisiones, unos 620 €. Decidió ahorrar unos meses y comprarla al contado.","Si veo «paga a plazos», entonces multiplico la cuota por los meses y lo comparo con el precio al contado.","Haz la multiplicación de una sola oferta a plazos."],
"DIN-09":["Joan preguntó a su abuela cuánto costaba el cine hace 10 años: unos 6 €. Hoy paga 9. Entendió que 100 € guardados en un cajón compran menos cada año.","Si guardo dinero mucho tiempo, entonces me pregunto si pierde valor parado en un cajón.","Pregunta el precio de una sola cosa de hace 10 años."],
"DIN-10":["Marta tenía 300 € todos juntos. Los repartió: 100 € para imprevistos, 150 € para el viaje de verano y 50 € para el largo plazo. Así sabía qué podía gastar y qué no.","Si recibo dinero, entonces lo reparto en mis tres huchas: imprevistos, corto plazo y largo plazo.","Separa solo los imprevistos del resto."],
"DIN-11":["A Unai le ofrecieron «un 20 % seguro en un mes». Preguntó cuánto podía perder y cuándo. Nadie supo contestarle. Si te prometen mucho y sin riesgo, desconfía.","Si alguien me ofrece una inversión, entonces pregunto cuánto puedo perder y cuándo.","Desconfía de cualquier promesa de ganar mucho sin riesgo."],
"DIN-12":["Lucas quería meter todo su dinero en una sola empresa porque «va a subir». Su profe le explicó que un fondo mundial reparte el dinero entre miles de empresas: si una cae, las demás compensan.","Si pienso en invertir, entonces miro si el dinero está repartido entre muchas empresas.","Busca qué significa «no poner todos los huevos en la misma cesta»."],
"DIN-13":["Sofía buscó qué era un fondo indexado global: una cesta de miles de empresas de todo el mundo, con comisiones bajas. No invirtió nada; solo lo entendió para cuando tenga ingresos.","Si oigo hablar de invertir, entonces miro qué es un fondo indexado y qué comisión cobra antes de decidir nada.","Lee una sola definición de fondo indexado."],
"DIN-14":["Eric probó el simulador de la sección Dinero: 50 € al mes durante 40 años. Con 1,5 puntos menos de rentabilidad por comisiones, acababa con muchos miles de euros menos. Entendió que la comisión importa tanto como lo que ahorras.","Si me ofrecen un producto para invertir, entonces pregunto primero qué comisión cobra al año.","Mueve el simulador una vez y mira la diferencia."],
"DIN-15":["A la madre de Àlex le escribieron por Instagram ofreciendo duplicar su dinero con criptomonedas. Àlex buscó el nombre en la web de la CNMV: aparecía en la lista de advertencias. Era una estafa.","Si alguien me pide dinero para invertir, entonces compruebo en la CNMV si está autorizado.","Desconfía de quien te escribe primero para ofrecerte ganar dinero."],
"DIN-16":["Clara miró la nómina de su hermana: 1.500 € brutos, pero cobraba unos 1.250 € netos. La diferencia eran el IRPF y la Seguridad Social, que pagan la sanidad, las pensiones o el paro.","Si me ofrecen un sueldo, entonces pregunto si es bruto o neto.","Aprende solo la diferencia entre bruto y neto."],
"DIN-17":["Rubén quería «ahorrar para un móvil» y no lo conseguía. Lo cambió por «300 € para junio»: eran 50 € al mes. Con cifra y fecha, llegó.","Si quiero algo caro, entonces le pongo cifra y fecha y calculo cuánto guardar al mes.","Elige solo la cifra y la fecha de tu objetivo."],
"EDU-06":["Sara estudiaba hasta las 2 antes de cada examen y se quedaba en blanco. Probó a repasar por la tarde y dormir 8 horas. Recordaba más y estaba más tranquila.","Si mañana tengo examen, entonces dejo de estudiar a las 22:30 y me voy a dormir.","Esta vez, acuéstate solo una hora antes."],
"EST-06":["Arnau llevaba semanas agobiado con las prácticas y no decía nada. Se lo contó a su tutor en 5 minutos. No se lo resolvió todo, pero le ayudó a ordenar qué hacer primero y se quitó un peso de encima.","Si algo me cuesta más de una semana, entonces se lo cuento a alguien de confianza.","Escribe a alguien solo «¿tienes 5 minutos?»."],
"HAB-04":["Nora llevaba días sin empezar un trabajo. Se paró a pensar qué sentía: miedo a hacerlo mal. Se dijo «solo 10 minutos». Al acabarlos, siguió media hora más.","Si voy a aplazar algo, entonces nombro qué siento y trabajo solo 10 minutos.","Abre el documento y escribe solo el título."],
"PEN-06":["Marc suspendió matemáticas. En vez de decir «no sirvo», pensó: qué pasó (estudié solo el último día), qué aprendo (necesito más días) y qué cambiaré (empezaré una semana antes). En el siguiente aprobó.","Si algo me sale mal, entonces me pregunto qué pasó, qué aprendo y qué cambiaré.","Responde solo a «¿qué cambiaré la próxima vez?»."],
"REL-07":["La pareja de Ainhoa le pedía la ubicación siempre y se enfadaba si hablaba con otros chicos. Ainhoa pensaba que era amor. Al leer estas conductas, lo habló con su prima y vio que era control.","Si alguien me controla el móvil o con quién hablo, entonces lo hablo con alguien de confianza.","Repasa la lista de conductas una sola vez."],
"VAL-07":["Mohamed no sabía qué le gustaba. Apuntó 3 cosas que le daban curiosidad: cocina, fotografía e informática. Fue a un taller gratis de fotografía en la biblioteca y descubrió que le encantaba editar.","Si un sábado no tengo planes, entonces dedico una hora a probar una de mis 3 curiosidades.","Piensa en una sola cosa que te dé curiosidad."],
"VAL-08":["A Noa le daba vergüenza preguntar en clase. Se propuso hacer una pregunta esa semana. Le temblaba la voz, pero el profe le dio las gracias y tres compañeros tenían la misma duda.","Si tengo una duda en clase, entonces levanto la mano en los primeros 5 minutos.","Haz algo pequeño que te dé un poco de vergüenza."],
"VAL-10":["Biel tartamudeaba y le aterraba exponer. En lugar de evitarlo, lo usó para entrenar: preparó muy bien la exposición y practicó en voz alta. No fue perfecta, pero fue la mejor preparada de la clase.","Si tengo un problema, entonces me pregunto qué puedo entrenar gracias a él.","Piensa qué te está enseñando un problema que tengas."],
"PEN-08":["Hugo no entregó un trabajo y pensó «soy un desastre, siempre igual». Lo cambió por «no lo entregué porque lo dejé para el final; la próxima vez empiezo el lunes». Se sintió mal, pero no se hundió.","Si después de un fallo me digo «soy…», entonces lo cambio por «he…» y escribo una cosa que haré distinto.","Cambia una sola frase al día de «soy» a «he»."],
"PEN-09":["Lucía creía que no mejoraba en inglés. Al apuntar cada noche un avance («he entendido un audio sin subtítulos»), vio en dos semanas que había mejorado más de lo que pensaba.","Si me lavo los dientes por la noche, entonces apunto en el móvil una cosa que hoy he hecho bien.","Piensa una sola cosa que hayas hecho bien hoy."],
"CRI-09":["Àlex quería dejar el ciclo tras un mal mes. Se preguntó si tenía vuelta atrás: no del todo. Esperó dos semanas, habló con su tutor y cambió de grupo de prácticas en vez de dejarlo.","Si tengo que decidir algo que no se puede deshacer, entonces espero un día y lo hablo con alguien antes.","Pregúntate solo: «¿esto tiene vuelta atrás?»."],
"CRI-10":["Sara estaba segura de que unas zapatillas eran las mejores. Se preguntó qué le haría cambiar de opinión: una prueba independiente. La buscó y vio que otras duraban el doble por menos dinero.","Si discuto sobre algo y me noto muy seguro, entonces me pregunto qué me haría cambiar de opinión.","Termina una discusión diciendo «puede que en esto tengas razón»."],
"REL-08":["Marc iba a subir una foto del grupo. Preguntó antes y Laia dijo que no le gustaba cómo salía. Subió otra. Nadie se enfadó y Laia se sintió respetada.","Si voy a publicar una foto donde sale otra persona, entonces le pregunto antes.","Pregunta «¿te parece bien?» una vez hoy."],
